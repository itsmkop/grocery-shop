<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#0b3f96"/>
<title>Apni Dukaan</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b3f96'/%3E%3Cpath d='M16 26h32l-3 22a4 4 0 0 1-4 3H23a4 4 0 0 1-4-3z' fill='%23fff'/%3E%3Cpath d='M24 26a8 8 0 0 1 16 0' fill='none' stroke='%23fff' stroke-width='3'/%3E%3C/svg%3E"/>
<link rel="manifest" href="manifest.webmanifest"/>
<style>
:root{--brand:#0b3f96;--brand2:#1257d6;--soft:#eef3ff;--bg:#f4f6fb;--card:#fff;--tx:#141a24;--mut:#7c8697;--line:#e9edf5;--green:#0f9d4f;--red:#e5484d;--amber:#c77700;--sh:0 6px 20px rgba(16,32,64,.07);--sh2:0 14px 38px rgba(16,32,64,.16)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Devanagari",sans-serif;background:var(--bg);color:var(--tx);padding-bottom:138px;-webkit-font-smoothing:antialiased}
img{display:block}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
.hidden{display:none!important}
/* header */
header.hd{position:sticky;top:0;z-index:30;background:linear-gradient(135deg,#0b3f96,#1257d6);color:#fff;box-shadow:0 4px 18px rgba(11,63,150,.22)}
.hd .r1{display:flex;align-items:center;gap:11px;padding:13px 16px 9px}
.hd .logo{width:40px;height:40px;border-radius:12px;object-fit:cover;background:#fff;flex:0 0 auto;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.hd .ph{width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;font-size:21px;flex:0 0 auto}
.hd .nm{font-size:17px;font-weight:800;line-height:1.1;letter-spacing:.2px}
.hd .sub{font-size:11.5px;opacity:.88;margin-top:1px}
.hd .cartTop{margin-left:auto;position:relative;font-size:22px;padding:7px 9px;border-radius:12px;background:rgba(255,255,255,.15)}
.hd .badge{position:absolute;top:-3px;right:-3px;background:#ffd400;color:#0b3f96;font-size:11px;font-weight:800;border-radius:999px;min-width:19px;height:19px;display:flex;align-items:center;justify-content:center;padding:0 4px;box-shadow:0 1px 4px rgba(0,0,0,.25)}
.hd .r2{padding:0 16px 13px}
.hd .search{position:relative;display:flex;align-items:center;gap:9px;background:#fff;border-radius:13px;padding:11px 13px;box-shadow:0 4px 14px rgba(0,0,0,.12)}
.hd .search input{flex:1;border:0;outline:none;font-size:14.5px;background:transparent;color:var(--tx);min-width:0}
.hd .locbar{display:flex;gap:8px 14px;font-size:11.5px;padding:8px 16px;background:rgba(0,0,0,.14);flex-wrap:wrap}
/* suggestions */
.sugg{position:absolute;left:0;right:0;top:calc(100% + 8px);background:#fff;border-radius:14px;box-shadow:var(--sh2);overflow-y:auto;max-height:62vh;z-index:40;padding:5px}
.sug{display:flex;gap:11px;align-items:center;padding:9px 10px;border-radius:11px}
.sug:active{background:#f2f5fb}
.sug img,.sug .ph{width:40px;height:40px;border-radius:10px;object-fit:cover;background:#f0f3f9;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.sug .sn{font-size:13.5px;font-weight:600}
.sug .sp{font-size:12px;color:var(--mut);margin-top:1px}
/* layout */
main{max-width:1040px;margin:0 auto}
section.blk{background:var(--card);margin:12px 12px 0;border-radius:16px;padding:14px 14px 16px;box-shadow:var(--sh)}
.wrap{padding:0 12px}
.secH{display:flex;align-items:baseline;gap:8px;margin:0 2px 12px;flex-wrap:wrap}
.secH b{font-size:16px;font-weight:800}
.secH .st{font-size:12px;color:var(--mut);font-weight:500}
.secH .more{margin-left:auto;font-size:12.5px;color:var(--brand);font-weight:700}
/* categories */
.cats{display:flex;gap:12px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none;scroll-snap-type:x proximity}
.cats::-webkit-scrollbar{display:none}
.cat{text-align:center;flex:0 0 auto;width:70px;scroll-snap-align:start}
.cat .ic{width:60px;height:60px;border-radius:20px;background:#f2f5fb;display:flex;align-items:center;justify-content:center;font-size:27px;margin:0 auto 7px;border:2px solid transparent;transition:transform .15s}
.cat:active .ic{transform:scale(.94)}
.cat.on .ic{border-color:var(--brand);background:var(--soft);box-shadow:0 4px 12px rgba(11,63,150,.15)}
.cat span{font-size:11px;color:var(--tx);line-height:1.25;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
/* hero + trust */
.herocard{margin:12px 12px 0;border-radius:18px;padding:18px;color:#fff;background:linear-gradient(120deg,#0f9d4f 0%,#0b3f96 92%);position:relative;overflow:hidden;box-shadow:0 10px 26px rgba(11,63,150,.25);display:flex;align-items:center;gap:12px}
.herocard .herocard-txt{flex:1;min-width:0;position:relative;z-index:2}
.herocard b{font-size:17px;display:block;line-height:1.25}
.herocard p{margin:4px 0 0;font-size:12.5px;opacity:.95;line-height:1.4}
.herocard .emo{position:absolute;right:4px;bottom:-12px;font-size:76px;opacity:.2;z-index:1}
.hero-cta{margin-top:11px;background:#fff;color:#0b3f96;font-weight:800;font-size:13px;border-radius:10px;padding:9px 15px;box-shadow:0 4px 12px rgba(0,0,0,.16)}
.trust{display:flex;gap:9px;margin:12px 12px 0;overflow-x:auto;scrollbar-width:none}
.trust::-webkit-scrollbar{display:none}
.trust .t{flex:0 0 auto;display:flex;align-items:center;gap:7px;background:#fff;border-radius:12px;padding:9px 13px;font-size:12px;font-weight:600;box-shadow:var(--sh)}
.trust .t .e{font-size:16px}
/* rails */
.rail{display:flex;gap:12px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none;scroll-snap-type:x mandatory}
.rail::-webkit-scrollbar{display:none}
.rail .pcard{flex:0 0 auto;width:142px;scroll-snap-align:start}
/* product card */
.pcard{background:#fff;border-radius:14px;overflow:hidden;display:flex;flex-direction:column;position:relative;box-shadow:0 3px 12px rgba(16,32,64,.07)}
.pcard:active{transform:scale(.985)}
.pcard .th{width:100%;aspect-ratio:1/1;object-fit:cover;background:#f1f4fa}
.pcard .th.ph{display:flex;align-items:center;justify-content:center;font-size:34px;color:#c2cad6}
.pcard .bd{padding:9px 10px 10px;display:flex;flex-direction:column;gap:3px;flex:1}
.pcard .nm{font-size:13px;font-weight:600;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:34px}
.pcard .ut{font-size:11px;color:var(--mut)}
.pcard .pr{display:flex;align-items:baseline;gap:5px;margin-top:auto;padding-top:6px;flex-wrap:wrap}
.pcard .p1{font-size:15px;font-weight:800}
.pcard .mrp{font-size:11px;color:var(--mut);text-decoration:line-through}
.pcard .off{font-size:10px;font-weight:800;color:var(--green)}
.pcard .tg{position:absolute;top:8px;left:8px;background:var(--green);color:#fff;font-size:9.5px;font-weight:800;padding:3px 7px;border-radius:7px;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.pcard .stock{font-size:10px;font-weight:700;margin-top:3px}
.stock.out{color:var(--red)}.stock.low{color:var(--amber)}.stock.in{color:var(--green)}
.act{margin-top:8px}
.add{width:100%;border:1.5px solid var(--brand);color:var(--brand);font-weight:800;font-size:12.5px;border-radius:10px;padding:8px 0;background:#fff}
.add:disabled{border-color:#cbd3e1;color:#9aa6b8}
.step{display:flex;align-items:center;justify-content:space-between;background:var(--brand);border-radius:10px;color:#fff;font-weight:800;overflow:hidden}
.step button{color:#fff;font-size:18px;width:36px;padding:5px 0;font-weight:800}
.step span{font-size:13.5px}
/* grid */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:560px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:860px){.grid{grid-template-columns:repeat(4,1fr)}}
.toolbar{display:flex;align-items:center;gap:9px;margin:0 0 12px;flex-wrap:wrap}
.toolbar select{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 10px;font-size:13px;color:var(--tx)}
.toolbar label{font-size:12.5px;color:var(--mut);display:flex;align-items:center;gap:5px}
.toolbar .cnt{margin-left:auto;font-size:12px;color:var(--mut)}
.empty{text-align:center;padding:52px 20px;color:var(--mut)}
.empty .big{font-size:46px;margin-bottom:8px}
/* cart bar + bottom nav */
.cartbar{position:fixed;left:12px;right:12px;bottom:78px;z-index:40;background:linear-gradient(135deg,#0b3f96,#1257d6);color:#fff;border-radius:15px;padding:12px 15px;display:flex;align-items:center;gap:10px;box-shadow:0 10px 28px rgba(11,63,150,.4)}
.cartbar .t{font-weight:800;font-size:14px}
.cartbar .s{font-size:11.5px;opacity:.9}
.cartbar button{margin-left:auto;background:#ffd400;color:#0b3f96;font-weight:800;border-radius:10px;padding:10px 15px;font-size:13.5px}
nav.bn{position:fixed;left:0;right:0;bottom:0;z-index:41;background:#fff;border-top:1px solid var(--line);display:flex;padding:7px 4px calc(7px + env(safe-area-inset-bottom));box-shadow:0 -4px 18px rgba(16,32,64,.06)}
nav.bn button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;color:var(--mut);font-weight:600;position:relative;padding:4px 0}
nav.bn button .i{font-size:21px;line-height:1}
nav.bn button.on{color:var(--brand)}
nav.bn .badge{position:absolute;top:-1px;right:calc(50% - 22px);background:var(--red);color:#fff;font-size:10px;font-weight:800;border-radius:999px;min-width:17px;height:17px;display:flex;align-items:center;justify-content:center;padding:0 4px}
/* sheets */
.ov{position:fixed;inset:0;z-index:60;background:rgba(12,20,34,.5);display:flex;align-items:flex-end;justify-content:center;backdrop-filter:blur(2px)}
@media(min-width:600px){.ov{align-items:center}}
.sheet{background:#fff;width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0}
@media(min-width:600px){.sheet{border-radius:20px}}
.sheet .sh{position:sticky;top:0;background:#fff;border-bottom:1px solid var(--line);padding:14px 16px;display:flex;align-items:center;gap:10px;z-index:3;border-radius:22px 22px 0 0}
.sheet .sh b{font-size:16px}
.sheet .sh .x{margin-left:auto;font-size:19px;color:var(--mut);width:34px;height:34px;border-radius:999px;background:#f2f5fb;display:flex;align-items:center;justify-content:center}
.sheet .in{padding:16px}
.hero{width:100%;aspect-ratio:4/3;object-fit:cover;background:#f1f4fa}
.hero.ph{display:flex;align-items:center;justify-content:center;font-size:64px;color:#c2cad6}
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;margin:12px 0;font-size:13.5px}
.kv dt{color:var(--mut)}.kv dd{margin:0;text-align:right;font-weight:600}
.bigprice{display:flex;align-items:baseline;gap:8px;margin:6px 0}
.bigprice .a{font-size:25px;font-weight:800}
.bigprice .b{font-size:14px;color:var(--mut);text-decoration:line-through}
.bigprice .c{font-size:13px;font-weight:800;color:var(--green)}
.acts{display:flex;gap:9px;margin-top:14px;flex-wrap:wrap}
.acts a,.acts button{flex:1;min-width:120px;text-align:center;text-decoration:none;border-radius:12px;padding:13px;font-weight:800;font-size:14px}
.b-call{background:#eef3ff;color:var(--brand)}
.b-wa{background:#1aa251;color:#fff}
.b-brand{background:var(--brand);color:#fff}
.crow{display:flex;gap:11px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.crow img,.crow .ph{width:54px;height:54px;border-radius:12px;object-fit:cover;background:#f1f4fa;display:flex;align-items:center;justify-content:center;font-size:22px;color:#c2cad6;flex:0 0 auto}
.crow .ci{flex:1;min-width:0}
.crow .cn{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crow .cp{font-size:12.5px;color:var(--mut);margin-top:2px}
.crow .step{width:100px;flex:0 0 auto}
.sum{display:flex;justify-content:space-between;font-size:13.5px;margin:8px 0}
.sum.tot{font-size:16px;font-weight:800;border-top:1px dashed var(--line);padding-top:11px;margin-top:11px}
.note{font-size:12px;color:var(--mut);line-height:1.55}
.chip{display:inline-block;background:var(--soft);color:var(--brand);font-size:11px;font-weight:700;border-radius:999px;padding:3px 10px}
.shopcard{background:#fff;border-radius:16px;padding:16px;margin:12px;box-shadow:var(--sh)}
/* forms */
.lbl{display:block;font-size:12.5px;color:var(--mut);margin-bottom:6px;font-weight:600}
.field{margin-bottom:13px}
.sheet input,.sheet textarea,.sheet select{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:12px 13px;font:inherit;background:#fff;color:var(--tx);outline:none}
.sheet input:focus,.sheet textarea:focus,.sheet select:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(11,63,150,.1)}
.seg{display:flex;gap:8px}
.seg button{flex:1;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:12px;font-size:13.5px;font-weight:700;color:var(--mut)}
.seg button.on{border-color:var(--brand);color:var(--brand);background:var(--soft)}
.ordcard{border:1px solid var(--line);border-radius:14px;padding:13px;margin-bottom:11px}
</style>
</head>
<body>

<header class="hd">
  <div class="r1">
    <div id="logoBox"></div>
    <div>
      <div class="nm" id="shopName">Apni Dukaan</div>
      <div class="sub" id="tagline">Aapki apni grocery shop</div>
    </div>
    <button class="cartTop" id="cartTop" title="Cart">&#128722;<span class="badge hidden" id="badgeTop">0</span></button>
  </div>
  <div class="r2">
    <div class="search">
      <span>&#128269;</span>
      <input id="q" placeholder="Atta, tel, dudh... dhundein" autocomplete="off"/>
      <button id="refresh" title="Refresh" style="font-size:17px;color:var(--brand)">&#8635;</button>
      <div class="sugg hidden" id="sugg"></div>
    </div>
  </div>
  <div class="locbar" id="locbar"></div>
</header>

<main id="main"></main>

<div class="cartbar hidden" id="cartbar">
  <div><div class="t" id="cbItems">0 item</div><div class="s" id="cbTotal"></div></div>
  <button onclick="openCart()">Cart dekhein &#8594;</button>
</div>

<nav class="bn" id="bnav"></nav>

<div class="ov hidden" id="ov"><div class="sheet" id="sheet"></div></div>

<script>
var API='https://api.github.com';
var DEFAULT_SRC='https://raw.githubusercontent.com/itsmkop/grocery-shop/main/data.json';
var SRC=(new URLSearchParams(location.search).get('src'))||localStorage.getItem('gs_src')||DEFAULT_SRC;
var DATA=null, view={q:'',cat:'',sort:'name',inStock:false}, tab='home', timer=null;
var CART=(function(){try{return JSON.parse(localStorage.getItem('gs_cart'))||{}}catch(e){return{}}})();

function $(s){return document.querySelector(s)}
function esc(s){return (s==null?'':String(s)).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function money(n){if(n===''||n==null)return '';var c=(DATA&&DATA.shop&&DATA.shop.currency)||'\u20B9';return c+Number(n).toLocaleString('en-IN',{maximumFractionDigits:2})}
function num(n){var x=Number(n);return isNaN(x)?0:x}
function daysLeft(d){if(!d)return null;var t=new Date();t.setHours(0,0,0,0);var e=new Date(d);if(isNaN(e))return null;e.setHours(0,0,0,0);return Math.round((e-t)/86400000)}
function fmtDate(d){if(!d)return '';var e=new Date(d);if(isNaN(e))return d;return e.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'})}
function saveCart(){try{localStorage.setItem('gs_cart',JSON.stringify(CART))}catch(e){}}
function prodById(id){return (DATA.products||[]).filter(function(p){return p.id===id})[0]}
function cartCount(){var n=0;for(var k in CART)n+=CART[k];return n}
function cartTotals(){var sub=0,mrp=0,cnt=0;for(var k in CART){var p=prodById(k);if(!p)continue;var q=CART[k];sub+=num(p.price)*q;mrp+=num(p.mrp||p.price)*q;cnt+=q}return{sub:sub,mrp:mrp,cnt:cnt,save:Math.max(0,mrp-sub)}}
function catIcon(name){var s=(name||'').toLowerCase();
 if(/atta|rice|chawal|flour|gehu/.test(s))return'\uD83C\uDF5A';
 if(/dal|pulse|daal/.test(s))return'\uD83E\uDED8';
 if(/oil|ghee|tel/.test(s))return'\uD83D\uDED2';
 if(/masala|spice|mirch/.test(s))return'\uD83C\uDF36\uFE0F';
 if(/snack|namkeen|chips/.test(s))return'\uD83C\uDF7F';
 if(/dairy|milk|dudh|curd|paneer/.test(s))return'\uD83E\uDD5B';
 if(/bever|drink|juice|cold/.test(s))return'\uD83E\uDD64';
 if(/personal|care|soap|shampoo/.test(s))return'\uD83E\uDDF4';
 if(/house|clean|detergent|surf/.test(s))return'\uD83E\uDDFD';
 if(/fruit|phal/.test(s))return'\uD83C\uDF4E';
 if(/veg|sabzi/.test(s))return'\uD83E\uDD66';
 if(/bakery|bread|pav/.test(s))return'\uD83C\uDF5E';
 if(/sweet|mithai|candy|choc/.test(s))return'\uD83C\uDF6C';
 if(/tea|coffee|chai/.test(s))return'\u2615';
 if(/baby/.test(s))return'\uD83C\uDF7C';
 if(/frozen|ice/.test(s))return'\uD83E\uDDCA';
 return'\uD83D\uDED2';
}

function setStatus(){} // reserved

function loadData(){
  var url=SRC+(SRC.indexOf('?')>-1?'&':'?')+'t='+Date.now();
  fetch(url,{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}).then(function(d){
    DATA=d; try{localStorage.setItem('gs_cache',JSON.stringify(d))}catch(e){}
    renderAll();
  }).catch(function(){
    var c=localStorage.getItem('gs_cache');
    if(c){DATA=JSON.parse(c);renderAll();}
    else{DATA={shop:{name:'Apni Dukaan',categories:[]},products:[]};renderAll();$('#main').innerHTML='<div class="empty"><div class="big">\uD83D\uDED2</div><b>Dukaan abhi taiyaar ho rahi hai</b><div style="margin-top:8px">Thodi der baad phir kholiye.</div></div>'}
  });
}

function header(){
  var s=(DATA&&DATA.shop)||{};
  $('#shopName').textContent=s.name||'Apni Dukaan';
  $('#tagline').textContent=s.tagline||'';
  var lb=$('#logoBox');
  lb.innerHTML=s.logo?'<img class="logo" src="'+esc(s.logo)+'" alt=""/>':'<div class="ph">\uD83D\uDED2</div>';
  var m=[];
  if(s.hours)m.push('\uD83D\uDD52 '+esc(s.hours));
  if(s.address)m.push('\uD83D\uDCCD '+esc(s.address));
  if(s.phone)m.push('\uD83D\uDCDE '+esc(s.phone));
  $('#locbar').innerHTML=m.join('')||'\uD83D\uDE9A Ghar par delivery available';
}

function allCats(){
  var s=(DATA&&DATA.shop)||{};var list=(s.categories||[]).slice();var seen={};
  (DATA.products||[]).forEach(function(p){if(p.category&&!seen[p.category]){seen[p.category]=1;if(list.indexOf(p.category)<0)list.push(p.category)}});
  return list;
}

function renderAll(){header();render();updateCartUI()}

function render(){
  renderNav();
  if(tab==='home')renderHome();
  else if(tab==='cats')renderCatsPage();
  else if(tab==='shop')renderShop();
  else renderHome();
}

function renderNav(){
  var items=[['home','\uD83C\uDFE0','Home'],['cats','\uD83D\uDDC2\uFE0F','Category'],['cart','\uD83D\uDED2','Cart'],['shop','\u2139\uFE0F','Dukaan']];
  $('#bnav').innerHTML=items.map(function(it){
    var badge=(it[0]==='cart'&&cartCount()>0)?'<span class="badge">'+cartCount()+'</span>':'';
    return '<button class="'+(tab===it[0]?'on':'')+'" data-t="'+it[0]+'">'+badge+'<span class="i">'+it[1]+'</span>'+it[2]+'</button>';
  }).join('');
  [].forEach.call($('#bnav').children,function(b){b.onclick=function(){var t=b.getAttribute('data-t');if(t==='cart'){openCart()}else{tab=t;render()}}});
}

/* ----- home ----- */
function renderHome(){
  var s=DATA.shop||{};var ps=DATA.products||[];
  var featured=ps.filter(function(p){return p.featured});
  var offers=ps.filter(function(p){return num(p.mrp)>num(p.price)&&num(p.price)>0});
  var bt=s.offerBanner||'';
  var html='';
  // hero

function catCircles(){

function bindCats(){

function filtered(){
  var ps=(DATA.products||[]).slice();var q=view.q.toLowerCase().trim();
  ps=ps.filter(function(p){
    if(view.cat&&p.category!==view.cat)return false;
    if(view.inStock&&stockInfo(p).k==='out')return false;
    if(q){var hay=((p.name||'')+' '+(p.brand||'')+' '+(p.tags||'')+' '+(p.category||'')).toLowerCase();if(hay.indexOf(q)<0)return false}
    return true;
  });
  if(view.sort==='priceL')ps.sort(function(a,b){return num(a.price)-num(b.price)});
  else if(view.sort==='priceH')ps.sort(function(a,b){return num(b.price)-num(a.price)});
  else if(view.sort==='new')ps.sort(function(a,b){return new Date(b.createdAt||0)-new Date(a.createdAt||0)});
  else ps.sort(function(a,b){return (a.name||'').localeCompare(b.name||'')});
  return ps;
}
function fillGrid(){
  var ps=filtered();var g=$('#grid');if(!g)return;

}
function stockInfo(p){var low=(DATA.shop.lowStock||5);if(p.available===false||p.stock===0||p.stock==='0')return{k:'out',t:'Stock khatam'};if(p.stock!==''&&p.stock!=null&&num(p.stock)<=low)return{k:'low',t:'Sirf '+p.stock+' bache'};return{k:'in',t:'Stock me'}}
function disc(p){return (num(p.mrp)>num(p.price)&&num(p.price)>0)?Math.round((1-num(p.price)/num(p.mrp))*100):0}
function card(p,small){
  var si=stockInfo(p);var d=disc(p);var dl=daysLeft(p.expiry);
  var th=p.photo?'<img class="th" loading="lazy" src="'+esc(p.photo)+'" alt=""/>':'<div class="th ph">\uD83D\uDED2</div>';

  return '<div class="pcard" data-id="'+esc(p.id)+'" onclick="openProduct(\''+esc(p.id)+'\')">'+th+
    (d>0?'<div class="tg">'+d+'% OFF</div>':'')+

   '<div style="text-align:left;margin-top:14px;background:#f7f9fc;border-radius:12px;padding:12px">'+rows+
   '<div class="sum"><span>Delivery</span><span>'+(o.delivery?money(o.delivery):'Free')+'</span></div>'+
   '<div class="sum tot"><span>Total</span><span>'+money(o.total)+'</span></div>'+
   '<div class="note" style="margin-top:8px">'+esc(o.name)+' \u00B7 '+esc(o.phone)+'<br>'+esc(o.type==='delivery'?o.address:'Dukaan se pickup')+'</div></div>'+
   '<div style="margin-top:14px">'+(wa?'<a class="b-wa" style="display:block;margin-bottom:9px" href="https://wa.me/'+wa+'?text='+encodeURIComponent(waOrderMsg(o))+'" target="_blank" rel="noopener">\uD83D\uDCAC Order WhatsApp par bhejein</a>':'')+
   '<button class="b-call" style="width:100%" onclick="copyText(waOrderMsg(LAST_ORDER))">\uD83D\uDCCB Order copy karein</button></div>'+
   '<button class="b-brand" style="width:100%;margin-top:9px;padding:13px;border-radius:11px;font-weight:800" onclick="closeOv()">Aur shopping karein</button></div>';
  openOv();
}
function copyText(t){try{navigator.clipboard.writeText(t);alert('Copy ho gaya \u2713')}catch(e){prompt('Copy karein:',t)}}
function openMyOrders(){
  var os=loadOrders();var body;
  if(!os.length){body='<div class="in"><div class="empty"><div class="big">\uD83D\uDCE6</div><b>Abhi koi order nahi</b><div style="margin-top:6px">Order karne par yahan dikhega.</div></div></div>'}
  else{body='<div class="in">'+os.slice().reverse().map(function(o){
     return '<div class="ordcard"><div style="display:flex;justify-content:space-between;align-items:center"><b>'+esc(o.id)+'</b><span class="chip">'+esc(o.status||'')+'</span></div><div class="note">'+new Date(o.at).toLocaleString('en-IN',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})+' \u00B7 '+o.cnt+' item</div><div style="font-weight:800;margin-top:4px">'+money(o.total)+'</div><button class="b-call" style="width:100%;margin-top:8px;padding:10px;border-radius:10px" onclick="reorder(\''+o.id+'\')">Phir se order karein</button></div>';
   }).join('')+'</div>';}
  $('#sheet').setAttribute('data-view','orders');
  $('#sheet').innerHTML='<div class="sh"><b>\uD83D\uDCE6 Mere orders</b><button class="x" onclick="closeOv()">\u2715</button></div>'+body;
  openOv();
}
function reorder(id){var o=loadOrders().filter(function(x){return x.id===id})[0];if(!o)return;o.items.forEach(function(it){var p=(DATA.products||[]).filter(function(x){return x.name===it.name})[0];if(p)CART[p.id]=(CART[p.id]||0)+it.qty});saveCart();closeOv();openCart()}
function showSugg(q){
  var box=$('#sugg');if(!box)return;q=(q||'').toLowerCase().trim();
  if(!q){box.classList.add('hidden');box.innerHTML='';return}
  var ps=(DATA.products||[]).filter(function(p){return ((p.name||'')+' '+(p.brand||'')).toLowerCase().indexOf(q)>-1}).slice(0,6);
  if(!ps.length){box.classList.add('hidden');box.innerHTML='';return}
  box.innerHTML=ps.map(function(p){return '<div class="sug" onclick="pickSugg(\''+esc(p.id)+'\')">'+(p.photo?'<img src="'+esc(p.photo)+'"/>':'<span class="ph">\uD83D\uDED2</span>')+'<div><div class="sn">'+esc(p.name)+'</div><div class="sp">'+money(p.price)+' \u00B7 '+esc(p.unit||'')+'</div></div></div>'}).join('');
  box.classList.remove('hidden');
}
function pickSugg(id){$('#sugg').classList.add('hidden');var p=prodById(id);if(p){$('#q').value=p.name;view.q=p.name;if(tab!=='home'){tab='home';render()}else fillGrid()}}

/* ----- overlays ----- */
function openOv(){$('#ov').classList.remove('hidden')}
function closeOv(){$('#ov').classList.add('hidden');$('#sheet').removeAttribute('data-view')}
$('#ov').addEventListener('click',function(e){if(e.target.id==='ov')closeOv()});

/* ----- cart UI ----- */
function updateCartUI(){
  var n=cartCount();var t=cartTotals();
  var bt=$('#badgeTop');if(bt){if(n>0){bt.textContent=n;bt.classList.remove('hidden')}else bt.classList.add('hidden')}
  var bar=$('#cartbar');
  if(bar){if(n>0){bar.classList.remove('hidden');$('#cbItems').textContent=n+' item';$('#cbTotal').textContent=money(t.sub)+' \u00B7 bachat '+money(t.save)}else bar.classList.add('hidden')}
  var navBadge=document.querySelector('#bnav .badge');if(navBadge){if(n<=0)navBadge.remove();else navBadge.textContent=n}
}

$('#q').addEventListener('input',function(e){view.q=e.target.value;showSugg(e.target.value);if(tab!=='home'){tab='home';render()}else fillGrid()});
$('#q').addEventListener('blur',function(){setTimeout(function(){var b=$('#sugg');if(b)b.classList.add('hidden')},220)});
$('#refresh').addEventListener('click',loadData);
$('#cartTop').addEventListener('click',openCart);

loadData();
timer=setInterval(loadData,180000);
document.addEventListener('visibilitychange',function(){if(!document.hidden)loadData()});
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}
</script>
</body>
</html>
