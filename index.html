<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#2874F0"/>
<title>Apni Dukaan</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232874F0'/%3E%3Cpath d='M18 24h28l-3 24a5 5 0 0 1-5 4H26a5 5 0 0 1-5-4z' fill='%23fff'/%3E%3Cpath d='M25 24a7 7 0 0 1 14 0' fill='none' stroke='%23fff' stroke-width='3.2'/%3E%3C/svg%3E"/>
<link rel="manifest" href="manifest.webmanifest"/>
<style>
:root{
 --fk:#2874F0;--fk2:#1a5fd0;--fkdark:#172337;--fkyellow:#FFC200;
 --green:#388E3C;--orange:#FB641B;--amber:#FF9F00;--red:#FF6161;
 --bg:#F1F3F6;--card:#fff;--tx:#212121;--mut:#878787;--sep:#e8e8e8;
 --sh:0 1px 2px rgba(0,0,0,.10);--sh2:0 8px 28px rgba(0,0,0,.20);
 --r:8px;--ease:cubic-bezier(.32,.72,0,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
html,body{margin:0;padding:0}
body{font-family:Roboto,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans Devanagari",sans-serif;background:var(--bg);color:var(--tx);padding-bottom:150px;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
img{display:block}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit;padding:0}
svg{display:block}
.hidden{display:none!important}
a{color:inherit}

/* ============ HEADER (Flipkart blue) ============ */
header.hd{position:sticky;top:0;z-index:40;background:var(--fk);box-shadow:0 1px 6px rgba(0,0,0,.22)}
.hd .r1{display:flex;align-items:center;gap:10px;padding:11px 14px 8px}
.brandbox{display:flex;align-items:center;gap:9px;min-width:0;flex:1}
.brandbox .logo{width:34px;height:34px;border-radius:8px;object-fit:cover;background:#fff;flex:0 0 auto}
.brandbox .ph{width:34px;height:34px;border-radius:8px;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;font-size:18px;flex:0 0 auto}
.brandbox .nm{min-width:0}
.brandbox .bn{font-size:16px;font-weight:700;font-style:italic;color:#fff;letter-spacing:-.2px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brandbox .bt{font-size:11.5px;color:rgba(255,255,255,.85);margin-top:1px;display:flex;align-items:center;gap:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{width:7px;height:7px;border-radius:50%;background:#8bff9e;display:inline-block;flex:0 0 auto}
.dot.off{background:var(--fkyellow)}
.hd .tools{margin-left:auto;display:flex;align-items:center;gap:6px;flex:0 0 auto}
.lang{font-size:12px;font-weight:700;color:#fff;background:rgba(255,255,255,.16);border-radius:6px;padding:6px 9px;letter-spacing:.3px}
.iconbtn{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;position:relative}
.iconbtn .badge{position:absolute;top:-2px;right:-2px;background:var(--fkyellow);color:var(--fkdark);font-size:10.5px;font-weight:800;border-radius:999px;min-width:17px;height:17px;display:flex;align-items:center;justify-content:center;padding:0 4px;border:1.5px solid var(--fk)}
.hd .r2{padding:0 12px 11px;position:relative}
.searchbox{display:flex;align-items:center;gap:9px;background:#fff;border-radius:6px;padding:9px 12px;box-shadow:var(--sh)}
.searchbox .sicon{color:var(--fk);flex:0 0 auto}
.searchbox input{flex:1;border:0;outline:none;font-size:15px;background:transparent;color:var(--tx);min-width:0}
.searchbox input::placeholder{color:#9aa0a6}
.searchbox .rf{color:var(--fk);display:flex;flex:0 0 auto}
.sugg{position:absolute;left:12px;right:12px;top:calc(100% - 5px);background:#fff;border-radius:8px;box-shadow:var(--sh2);overflow-y:auto;max-height:60vh;z-index:45;padding:4px;border:1px solid var(--sep)}
.sug{display:flex;gap:11px;align-items:center;padding:9px 10px;border-radius:6px}
.sug:active{background:#f2f2f2}
.sug img,.sug .ph{width:38px;height:38px;border-radius:6px;object-fit:contain;background:#fff;border:1px solid var(--sep);display:flex;align-items:center;justify-content:center;flex:0 0 auto;color:var(--mut)}
.sug .sn{font-size:14px;font-weight:500;letter-spacing:-.1px}
.sug .sp{font-size:12.5px;color:var(--mut);margin-top:1px}

/* ============ LAYOUT ============ */
main{max-width:1080px;margin:0 auto;padding-bottom:6px}
.blk{background:var(--card);margin:10px 0 0;padding:14px 12px 16px;box-shadow:var(--sh)}
.secH{display:flex;align-items:center;gap:8px;margin:0 2px 12px}
.secH b{font-size:16px;font-weight:700;letter-spacing:-.3px}
.secH .st{font-size:12px;color:var(--mut)}
.secH .more{margin-left:auto;font-size:12.5px;color:#fff;background:var(--fk);font-weight:700;border-radius:4px;padding:6px 10px;letter-spacing:.2px}

/* ============ BANNER CAROUSEL ============ */
.bcar{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding:10px 12px 2px;margin-top:10px}
.bcar::-webkit-scrollbar{display:none}
.btile{flex:0 0 100%;scroll-snap-align:center;border-radius:10px;padding:18px 16px;color:#fff;display:flex;align-items:center;gap:12px;min-height:96px;box-shadow:var(--sh)}
.btile .bt-t{flex:1;min-width:0}
.btile b{font-size:17px;font-weight:800;letter-spacing:-.3px;display:block}
.btile p{margin:4px 0 0;font-size:12.5px;opacity:.94}
.btile .bt-e{font-size:38px;flex:0 0 auto}
.b1{background:linear-gradient(120deg,#2874F0,#5a9bff)}
.b2{background:linear-gradient(120deg,#388E3C,#6cc46f)}
.b3{background:linear-gradient(120deg,#FB641B,#ff9a5c)}

/* trust strip */
.trust{display:flex;gap:6px;padding:12px 12px 0;overflow-x:auto;scrollbar-width:none}
.trust::-webkit-scrollbar{display:none}
.trust .t{flex:1 0 auto;display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;color:var(--tx);background:#fff;border:1px solid var(--sep);border-radius:20px;padding:7px 12px;white-space:nowrap}
.trust .t .e{font-size:14px}

/* ============ CATEGORY CIRCLES ============ */
.cats{display:flex;gap:14px;overflow-x:auto;padding:2px 2px 4px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cat{flex:0 0 auto;width:70px;display:flex;flex-direction:column;align-items:center;gap:7px}
.cat .ic{width:58px;height:58px;border-radius:50%;background:#eef4ff;border:1.5px solid #dbe7ff;display:flex;align-items:center;justify-content:center;font-size:26px}
.cat.on .ic{border-color:var(--fk);background:#e2edff;box-shadow:0 0 0 2px rgba(40,116,240,.18)}
.cat span{font-size:11.5px;text-align:center;line-height:1.2;color:var(--tx);font-weight:500;max-width:70px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.cat.on span{color:var(--fk);font-weight:700}

/* ============ PRODUCT GRID + CARD ============ */
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 2px 12px}
.toolbar select{font:inherit;font-size:13px;border:1px solid var(--sep);background:#fff;border-radius:6px;padding:8px 10px;color:var(--tx);outline:none}
.toolbar label{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--tx)}
.toolbar .cnt{margin-left:auto;font-size:12.5px;color:var(--mut)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:560px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:820px){.grid{grid-template-columns:repeat(4,1fr)}}
.rail{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}
.rail::-webkit-scrollbar{display:none}
.rail .pc{flex:0 0 44%;max-width:180px}
.pc{background:#fff;border:1px solid var(--sep);border-radius:6px;overflow:hidden;display:flex;flex-direction:column;transition:box-shadow .2s var(--ease)}
.pc:active{box-shadow:0 4px 14px rgba(0,0,0,.14)}
.pc-img{position:relative;aspect-ratio:1/1;background:#fff;display:flex;align-items:center;justify-content:center;padding:10px;border-bottom:1px solid #f2f2f2}
.pc-img img{width:100%;height:100%;object-fit:contain}
.pc-img .ph{font-size:40px;color:#cfcfcf}
.pc-off{position:absolute;left:0;bottom:0;background:var(--green);color:#fff;font-size:10.5px;font-weight:700;padding:3px 7px;border-top-right-radius:6px}
.pc-oos{position:absolute;inset:0;background:rgba(255,255,255,.72);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--red);text-transform:uppercase;letter-spacing:.4px}
.pc-body{padding:9px 10px 11px;display:flex;flex-direction:column;flex:1}
.pc-brand{font-size:11px;color:var(--mut);font-weight:600;text-transform:uppercase;letter-spacing:.3px}
.pc-name{font-size:13.5px;font-weight:500;line-height:1.28;margin-top:2px;color:var(--tx);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:34px}
.pc-chip{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:700;color:var(--green);background:#e9f5ea;border-radius:3px;padding:2px 6px;margin-top:6px;align-self:flex-start}
.pc-chip.low{color:#b26a00;background:#fff4e0}
.pc-chip.exp{color:#b26a00;background:#fff4e0}
.pc-price{display:flex;align-items:baseline;gap:6px;margin-top:8px;flex-wrap:wrap}
.pc-price .p1{font-size:15.5px;font-weight:700;color:var(--tx)}
.pc-price .mrp{font-size:12px;color:var(--mut);text-decoration:line-through}
.pc-price .off{font-size:12px;font-weight:700;color:var(--green)}
.pc-act{margin-top:auto;padding-top:10px}
.add{width:100%;border:1px solid var(--fk);background:#fff;color:var(--fk);font-weight:700;font-size:13px;letter-spacing:.4px;border-radius:5px;padding:8px;text-transform:uppercase}
.add:disabled{border-color:#dcdcdc;color:#b7b7b7;background:#fafafa}
.add:active{background:#eef4ff}
.step{display:flex;align-items:center;justify-content:space-between;border:1px solid var(--fk);border-radius:5px;color:var(--fk);overflow:hidden;font-weight:700}
.step button{width:34px;height:34px;font-size:19px;color:var(--fk);line-height:1}
.step span{flex:1;text-align:center;font-size:14px}

/* ============ CART BAR + BOTTOM NAV ============ */
.cartbar{position:fixed;left:0;right:0;bottom:60px;z-index:38;background:#fff;box-shadow:0 -2px 10px rgba(0,0,0,.16);display:flex;align-items:center;gap:12px;padding:10px 14px;border-top:1px solid var(--sep)}
.cartbar .t{font-size:13px;font-weight:700}
.cartbar .s{font-size:11.5px;color:var(--mut);margin-top:1px}
.cartbar button{margin-left:auto;background:var(--orange);color:#fff;font-weight:700;font-size:13.5px;border-radius:5px;padding:11px 22px;letter-spacing:.3px;text-transform:uppercase;box-shadow:var(--sh)}
nav.bn{position:fixed;left:0;right:0;bottom:0;z-index:39;background:#fff;border-top:1px solid var(--sep);display:flex;box-shadow:0 -1px 8px rgba(0,0,0,.10)}
nav.bn button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 0 8px;font-size:10.5px;font-weight:600;color:#6b7280;position:relative}
nav.bn button.on{color:var(--fk)}
nav.bn button svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
nav.bn button .badge{position:absolute;top:2px;right:calc(50% - 22px);background:var(--red);color:#fff;font-size:10px;font-weight:800;border-radius:999px;min-width:17px;height:17px;display:flex;align-items:center;justify-content:center;padding:0 4px}

/* ============ SHEET ============ */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:60;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s var(--ease)}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{background:#fff;width:100%;max-width:560px;max-height:92vh;overflow-y:auto;border-radius:14px 14px 0 0;animation:up .28s var(--ease)}
@keyframes up{from{transform:translateY(40px);opacity:.6}to{transform:translateY(0);opacity:1}}
.sh{position:sticky;top:0;background:#fff;display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--sep);z-index:2}
.sh b{font-size:16px;font-weight:700;letter-spacing:-.2px}
.sh .x{margin-left:auto;width:32px;height:32px;border-radius:50%;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:15px;color:var(--tx)}
.sheet .in{padding:16px}
.sheet .hero{width:100%;aspect-ratio:1/1;object-fit:contain;background:#fff;border-bottom:1px solid var(--sep);max-height:340px}
.sheet .hero.ph{display:flex;align-items:center;justify-content:center;font-size:80px;color:#cfcfcf}
.bigprice{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;margin-bottom:14px}
.bigprice .a{font-size:24px;font-weight:800}
.bigprice .b{font-size:15px;color:var(--mut);text-decoration:line-through}
.bigprice .c{font-size:15px;font-weight:700;color:var(--green)}
dl.kv{margin:0 0 6px;border-top:1px solid var(--sep)}
dl.kv dt{font-size:11.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.4px;padding:11px 0 2px;font-weight:600}
dl.kv dd{margin:0;font-size:14px;padding:0 0 11px;border-bottom:1px solid #f4f4f4}
.acts{display:flex;gap:9px;flex-wrap:wrap;margin-top:16px}
.acts a{flex:1;min-width:96px;text-align:center;text-decoration:none;border-radius:6px;padding:12px;font-weight:700;font-size:14px}
.b-call{background:#fff;color:var(--fk);border:1px solid var(--fk)}
.b-wa{background:#25D366;color:#fff}
.b-brand{background:var(--fk);color:#fff}
.crow{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #f4f4f4}
.crow .ph{width:56px;height:56px;border-radius:6px;background:#fff;border:1px solid var(--sep);overflow:hidden;display:flex;align-items:center;justify-content:center;flex:0 0 auto;font-size:24px;color:var(--mut)}
.crow .ci{flex:1;min-width:0}
.crow .cn{font-size:13.5px;font-weight:500;line-height:1.25}
.crow .cp{font-size:12.5px;color:var(--mut);margin-top:3px}
.crow .step{flex:0 0 auto}
.sum{display:flex;justify-content:space-between;font-size:13.5px;padding:5px 0;color:var(--tx)}
.sum.tot{font-size:16px;font-weight:800;border-top:1px solid var(--sep);margin-top:8px;padding-top:11px}
.field{margin-bottom:14px}
.lbl{display:block;font-size:11.5px;color:var(--mut);margin:0 2px 6px;font-weight:600;text-transform:uppercase;letter-spacing:.4px}
.field input,.field textarea,.field select{font:inherit;width:100%;border:1px solid var(--sep);background:#fff;border-radius:6px;padding:12px 13px;font-size:15px;color:var(--tx);outline:none}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--fk);box-shadow:0 0 0 2px rgba(40,116,240,.16)}
.seg{display:flex;gap:8px}
.seg button{flex:1;border:1px solid var(--sep);background:#fff;border-radius:6px;padding:11px;font-size:13.5px;font-weight:600;color:var(--tx)}
.seg button.on{border-color:var(--fk);background:#eef4ff;color:var(--fk)}
.ordcard{border:1px solid var(--sep);border-radius:8px;padding:13px;margin-bottom:11px}
.chip{font-size:11px;font-weight:700;color:var(--fk);background:#eef4ff;border-radius:4px;padding:3px 8px}
.note{font-size:12.5px;color:var(--mut);line-height:1.5}
.empty{text-align:center;padding:34px 20px;color:var(--mut);font-size:13.5px}
.empty .big{font-size:56px;margin-bottom:10px}
.empty b{display:block;font-size:16px;color:var(--tx);margin-bottom:5px;font-weight:700}
</style>
</head>
<body>

<header class="hd">
  <div class="r1">
    <div class="brandbox">
      <div id="logoBox"></div>
      <div class="nm">
        <div class="bn" id="shopName">Apni Dukaan</div>
        <div class="bt"><span class="dot" id="statusDot"></span><span id="tagline"></span></div>
      </div>
    </div>
    <div class="tools">
      <button class="lang" id="langBtn">EN</button>
      <button class="iconbtn" id="cartTop" aria-label="Cart">
        <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="20" r="1.4"/><circle cx="18" cy="20" r="1.4"/><path d="M2 3h3l2.4 12.3a1.6 1.6 0 0 0 1.6 1.3h8.4a1.6 1.6 0 0 0 1.6-1.3L21 7H6"/></svg>
        <span class="badge hidden" id="badgeTop"></span>
      </button>
    </div>
  </div>
  <div class="r2">
    <div class="searchbox">
      <svg class="sicon" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.4-3.4"/></svg>
      <input id="q" autocomplete="off"/>
      <button class="rf" id="refresh" aria-label="Refresh">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/></svg>
      </button>
    </div>
    <div class="sugg hidden" id="sugg"></div>
  </div>
</header>

<main id="main"></main>

<div class="cartbar hidden" id="cartbar">
  <div><div class="t" id="cbItems"></div><div class="s" id="cbTotal"></div></div>
  <button onclick="openCart()"><span id="cbBtn"></span></button>
</div>

<nav class="bn" id="bnav"></nav>

<div class="ov hidden" id="ov"><div class="sheet" id="sheet"></div></div>

 if(/atta|rice|chawal|flour|gehu/.test(s))return'\uD83C\uDF5A';if(/dal|pulse|daal/.test(s))return'\uD83E\uDED8';if(/oil|ghee|tel/.test(s))return'\uD83E\uDED2';if(/masala|spice|mirch/.test(s))return'\uD83C\uDF36\uFE0F';if(/snack|namkeen|chips/.test(s))return'\uD83C\uDF7F';if(/dairy|milk|dudh|curd|paneer/.test(s))return'\uD83E\uDD5B';if(/bever|drink|juice|cold/.test(s))return'\uD83E\uDD64';if(/personal|care|soap|shampoo/.test(s))return'\uD83E\uDDF4';if(/house|clean|detergent|surf/.test(s))return'\uD83E\uDDFD';if(/fruit|phal/.test(s))return'\uD83C\uDF4E';if(/veg|sabzi/.test(s))return'\uD83E\uDD66';if(/bakery|bread|pav/.test(s))return'\uD83C\uDF5E';if(/sweet|mithai|candy|choc/.test(s))return'\uD83C\uDF6C';if(/tea|coffee|chai/.test(s))return'\u2615';if(/baby/.test(s))return'\uD83C\uDF7C';if(/frozen|ice/.test(s))return'\uD83E\uDDCA';return'\uD83D\uDED2'}

/* Supports both the new multi-retailer data shape (retailers + per-retailer
   products) and the old single-shop shape (shop + products). */
function normalize(d){
  if(d && d.retailers && d.retailers.length){
    var rid=d.publicRetailerId||d.retailers[0].id;
    var r=d.retailers.filter(function(x){return x.id===rid})[0];
    if(!r || r.status==='blocked'){
      var alt=d.retailers.filter(function(x){return x.status!=='blocked'})[0];
      if(alt){r=alt;rid=alt.id}
    }
    if(!r)return d;
    return {shop:r,products:(d.products||[]).filter(function(p){return p.retailerId===rid})};
  }
  return d;
}

  fetch(url,{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}).then(function(d){
    DATA=normalize(d);try{localStorage.setItem('gs_cache',JSON.stringify(d))}catch(e){}
    var dot=$('#statusDot');if(dot)dot.className='dot';
    renderAll();
  }).catch(function(){
    var c=localStorage.getItem('gs_cache');
    if(c){DATA=normalize(JSON.parse(c));var dot=$('#statusDot');if(dot)dot.className='dot off';renderAll();}
    else{DATA={shop:{name:'Apni Dukaan',categories:[]},products:[]};renderAll();$('#main').innerHTML='<div class="empty"><div class="big">\uD83D\uDED2</div><b>'+t('shopReady')+'</b>'+t('shopReadySub')+'</div>'}
  });
}

  return list;
}

function filtered(){
  var ps=(DATA.products||[]).slice();var q=view.q.toLowerCase().trim();
  ps=ps.filter(function(p){
    if(view.cat&&p.category!==view.cat)return false;
    if(view.inStock&&stockInfo(p).k==='out')return false;
    if(q){var hay=((p.name||'')+' '+(p.brand||'')+' '+(p.tags||'')+' '+(p.category||'')).toLowerCase();if(hay.indexOf(q)<0)return false}
    return true;
  });
  if(view.sort==='priceL')ps.sort(function(a,b){return num(a.price)-num(b.price)});
  else if(view.sort==='priceH')ps.sort(function(a,b){return num(b.price)-num(a.price)});
  else if(view.sort==='new')ps.sort(function(a,b){return new Date(b.createdAt||0)-new Date(a.createdAt||0)});
  else ps.sort(function(a,b){return (a.name||'').localeCompare(b.name||'')});
  return ps;
}

function stockInfo(p){var low=(DATA.shop.lowStock||5);if(p.available===false||p.stock===0||p.stock==='0')return{k:'out',t:t('out')};if(p.stock!==''&&p.stock!=null&&num(p.stock)<=low)return{k:'low',t:t('onlyLeft').replace('{n}',p.stock)};return{k:'in',t:t('inStock')}}
function disc(p){return (num(p.mrp)>num(p.price)&&num(p.price)>0)?Math.round((1-num(p.price)/num(p.mrp))*100):0}

  var th=p.photo?'<img class="th" loading="lazy" src="'+esc(p.photo)+'" alt=""/>':'<div class="ph">\uD83D\uDED2</div>';
  var oos=(si.k==='out')?'<div class="pc-oos">'+t('out')+'</div>':'';

    '</div></div>';

  var html='<section class="blk"><div class="secH"><b>'+t('categories')+'</b></div><div class="cats">'+catCircles()+'</div></section>';
  if(view.cat){html+='<section class="blk"><div class="secH"><b>'+catIcon(view.cat)+' '+esc(view.cat)+'</b></div><div class="grid" id="grid"></div></section>'}
  else{cats.forEach(function(c){var items=ps.filter(function(p){return p.category===c});if(!items.length)return;
    html+='<section class="blk"><div class="secH"><b>'+catIcon(c)+' '+esc(c)+'</b><span class="more" data-c="'+esc(c)+'">'+items.length+' '+t('items')+' \u203A</span></div><div class="rail">'+items.slice(0,10).map(function(p){return card(p)}).join('')+'</div></section>'});}
  $('#main').innerHTML=html;
  bindCats();if(view.cat)fillGrid();
  [].forEach.call(document.querySelectorAll('[data-c]'),function(el){el.onclick=function(){view.cat=el.getAttribute('data-c');renderCatsPage();window.scrollTo({top:0,behavior:'smooth'})}});
}

function renderShop(){
  var s=DATA.shop||{};
  $('#main').innerHTML='<section class="blk"><div class="secH"><b>'+t('shopDetails')+'</b></div><dl class="kv">'+
   row(t('nameL'),s.name)+(s.owner?row(t('owner'),s.owner):'')+(s.address?row(t('address'),s.address):'')+(s.hours?row(t('timing'),s.hours):'')+(s.phone?row(t('phone'),s.phone):'')+(s.whatsapp?row(t('whatsapp'),s.whatsapp):'')+(s.upi?row('UPI',s.upi):'')+(s.gstin?row(t('gstin'),s.gstin):'')+(s.deliveryNote?row(t('delivery'),s.deliveryNote):'')+
   '</dl><div class="acts">'+(s.phone?'<a class="b-call" href="tel:'+esc(s.phone)+'">'+t('call')+'</a>':'')+(s.whatsapp?'<a class="b-wa" href="https://wa.me/'+String(s.whatsapp).replace(/[^0-9]/g,'')+'" target="_blank" rel="noopener">'+t('whatsapp')+'</a>':'')+'</div>'+
   '<button class="b-brand" style="width:100%;margin-top:12px;border-radius:6px;padding:14px;font-weight:700;font-size:15px" onclick="openMyOrders()">'+t('myOrders')+'</button>'+
   '<div class="note" style="text-align:center;padding:14px 0 0">'+t('ratesLive')+'</div></section>';
}
function row(k,v){return '<dt>'+esc(k)+'</dt><dd>'+esc(v)+'</dd>'}

function openProduct(id){
  var p=prodById(id);if(!p)return;var s=DATA.shop||{};var si=stockInfo(p);var d=disc(p);var dl=daysLeft(p.expiry);
  var wa=String(s.whatsapp||s.phone||'').replace(/[^0-9]/g,'');
  var txt=encodeURIComponent(p.name+(p.unit?' ('+p.unit+')':'')+' - '+money(p.price));
  var upi=s.upi?('upi://pay?pa='+encodeURIComponent(s.upi)+'&pn='+encodeURIComponent(s.name||'Shop')+'&am='+num(p.price)+'&cu=INR&tn='+encodeURIComponent(p.name)):'';
  var hero=p.photo?'<img class="hero" src="'+esc(p.photo)+'" alt=""/>':'<div class="hero ph">\uD83D\uDED2</div>';
  var kv='';if(p.brand)kv+=row(t('brand'),p.brand);if(p.category)kv+=row(t('categories'),p.category);if(p.unit)kv+=row(t('pack'),p.unit);kv+=row(t('availability'),si.t);if(dl!=null)kv+=row(t('expiry'),fmtDate(p.expiry));if(p.desc)kv+=row(t('details'),p.desc);
  var acts='';
  if(s.phone)acts+='<a class="b-call" href="tel:'+esc(s.phone)+'">'+t('call')+'</a>';
  if(wa)acts+='<a class="b-wa" href="https://wa.me/'+wa+'?text='+txt+'" target="_blank" rel="noopener">'+t('order')+'</a>';
  if(upi)acts+='<a class="b-brand" href="'+upi+'">UPI</a>';
  $('#sheet').setAttribute('data-view','product');
  $('#sheet').innerHTML='<div class="sh"><b>'+esc(p.name)+'</b><button class="x" onclick="closeOv()">\u2715</button></div>'+hero+
   '<div class="in"><div class="bigprice"><span class="a">'+money(p.price)+'</span>'+(d>0?'<span class="b">'+money(p.mrp)+'</span><span class="c">'+d+'% off</span>':'')+'</div>'+
   '<dl class="kv">'+kv+'</dl><div id="pAct">'+bigAction(p.id,si)+'</div><div class="acts">'+acts+'</div></div>';
  openOv();
}
function bigAction(id,si){
  var q=CART[id]||0;var dis=(si&&si.k==='out');
  if(q<=0)return '<button class="add" style="padding:14px;font-size:15px" '+(dis?'disabled':'')+' onclick="addCart(\''+id+'\');openProduct(\''+id+'\')">'+(dis?t('out'):t('addToCart'))+'</button>';
  return '<div class="step" style="padding:2px 10px;height:46px"><button onclick="decCart(\''+id+'\');openProduct(\''+id+'\')">\u2212</button><span>'+q+'</span><button onclick="addCart(\''+id+'\');openProduct(\''+id+'\')">+</button></div>';
}

function openCart(){
  var s=DATA.shop||{};var ids=Object.keys(CART).filter(function(k){return prodById(k)});var body;
  if(!ids.length){body='<div class="in"><div class="empty"><div class="big">\uD83D\uDED2</div><b>'+t('cartEmpty')+'</b>'+t('addItems')+'</div></div>'}
  else{
    var tt=cartTotals();
    var rows=ids.map(function(k){var p=prodById(k);var q=CART[k];
      return '<div class="crow"><div class="ph">'+(p.photo?'<img src="'+esc(p.photo)+'" style="width:100%;height:100%;object-fit:contain"/>':'\uD83D\uDED2')+'</div><div class="ci"><div class="cn">'+esc(p.name)+'</div><div class="cp">'+money(p.price)+' \u00B7 '+esc(p.unit||'')+'</div></div><div class="step"><button onclick="decCart(\''+k+'\')">\u2212</button><span>'+q+'</span><button onclick="addCart(\''+k+'\')">+</button></div></div>';
    }).join('');
    var del=num(s.deliveryCharge)||0;
    body='<div class="in">'+rows+'<div style="margin-top:14px"><div class="sum"><span>'+t('subTotal')+' ('+tt.cnt+' '+t('items')+')</span><span>'+money(tt.mrp)+'</span></div>'+
     (tt.save>0?'<div class="sum" style="color:var(--green)"><span>'+t('savings')+'</span><span>\u2212 '+money(tt.save)+'</span></div>':'')+
     (del?'<div class="sum"><span>'+t('delivery')+'</span><span>'+money(del)+'</span></div>':'')+
     '<div class="sum tot"><span>'+t('total')+'</span><span>'+money(tt.sub+del)+'</span></div></div>'+
     '<button class="b-brand" style="width:100%;margin-top:16px;border-radius:6px;padding:15px;font-weight:700;font-size:15px" onclick="openCheckout()">'+t('checkout')+' \u2192</button></div>';
  }
  $('#sheet').setAttribute('data-view','cart');
  $('#sheet').innerHTML='<div class="sh"><b>'+t('cart')+'</b><button class="x" onclick="closeOv()">\u2715</button></div>'+body;
  openOv();
}

var CO={type:'delivery',pay:'cod'},LAST_ORDER=null;
function val(s){var e=$(s);return e?e.value.trim():''}
function orderId(){var d=new Date();var p=function(n){return (n<10?'0':'')+n};return 'ORD-'+String(d.getFullYear()).slice(2)+p(d.getMonth()+1)+p(d.getDate())+'-'+Math.floor(1000+Math.random()*9000)}
function loadOrders(){try{return JSON.parse(localStorage.getItem('gs_orders'))||[]}catch(e){return[]}}
function saveOrder(o){var a=loadOrders();a.push(o);if(a.length>50)a=a.slice(a.length-50);try{localStorage.setItem('gs_orders',JSON.stringify(a))}catch(e){}}
function coType(x){CO.type=x;$('#co_t_del').className=(x==='delivery'?'on':'');$('#co_t_pick').className=(x==='pickup'?'on':'');$('#co_addrWrap').style.display=(x==='delivery'?'':'none')}
function coPay(x){CO.pay=x;$('#co_p_cod').className=(x==='cod'?'on':'');$('#co_p_upi').className=(x==='upi'?'on':'')}
function openCheckout(){
  var s=DATA.shop||{};var ids=Object.keys(CART).filter(function(k){return prodById(k)});
  if(!ids.length){toast(t('cartEmpty'));return}
  CO={type:'delivery',pay:'cod'};
  $('#sheet').setAttribute('data-view','checkout');
  $('#sheet').innerHTML='<div class="sh"><b>'+t('checkout')+'</b><button class="x" onclick="closeOv()">\u2715</button></div><div class="in">'+
   '<div class="field"><label class="lbl">'+t('yourName')+'</label><input id="co_name"/></div>'+
   '<div class="field"><label class="lbl">'+t('mobile')+'</label><input id="co_phone" inputmode="numeric" maxlength="10"/></div>'+
   '<div class="field"><label class="lbl">'+t('deliveryOrPickup')+'</label><div class="seg"><button type="button" class="on" id="co_t_del" onclick="coType(\'delivery\')">'+t('homeDelivery')+'</button><button type="button" id="co_t_pick" onclick="coType(\'pickup\')">'+t('fromShop')+'</button></div></div>'+
   '<div class="field" id="co_addrWrap"><label class="lbl">'+t('fullAddress')+'</label><textarea id="co_addr" rows="2" placeholder="'+esc(t('addrPh'))+'"></textarea></div>'+
   '<div class="field"><label class="lbl">'+t('whenNeed')+'</label><select id="co_slot"><option>'+t('slot1')+'</option><option>'+t('slot2')+'</option><option>'+t('slot3')+'</option><option>'+t('slot4')+'</option></select></div>'+
   '<div class="field"><label class="lbl">'+t('payment')+'</label><div class="seg"><button type="button" class="on" id="co_p_cod" onclick="coPay(\'cod\')">'+t('cash')+'</button><button type="button" id="co_p_upi" onclick="coPay(\'upi\')">'+t('upi')+'</button></div></div>'+
   '<div class="field"><label class="lbl">'+t('anyNote')+'</label><input id="co_note" placeholder="'+esc(t('notePh'))+'"/></div>'+
   '<div class="sum tot"><span>'+t('total')+'</span><span id="co_total"></span></div>'+
   '<button class="b-brand" style="width:100%;border-radius:6px;padding:15px;font-weight:700;font-size:15px;margin-top:10px" onclick="placeOrder()">'+t('confirmOrder')+'</button>'+
   '<div class="note" style="margin-top:12px;text-align:center">'+t('orderWaNote')+'</div></div>';
  $('#co_total').textContent=money(cartTotals().sub+(num(s.deliveryCharge)||0));
  openOv();
}
function placeOrder(){
  var s=DATA.shop||{};var ids=Object.keys(CART).filter(function(k){return prodById(k)});
  if(!ids.length){toast(t('cartEmpty'));return}
  var name=val('#co_name');var phone=val('#co_phone').replace(/\D/g,'');var addr=val('#co_addr');
  if(!name){toast(t('enterName'));return}
  if(phone.length<10){toast(t('enterPhone'));return}
  if(CO.type==='delivery'&&!addr){toast(t('needAddress'));return}
  var tt=cartTotals();var del=num(s.deliveryCharge)||0;
  var items=ids.map(function(k){var p=prodById(k);return{name:p.name,unit:p.unit||'',qty:CART[k],price:num(p.price),mrp:num(p.mrp||p.price)}});
  var o={id:orderId(),at:new Date().toISOString(),items:items,cnt:tt.cnt,sub:tt.sub,save:tt.save,delivery:del,total:tt.sub+del,name:name,phone:phone,type:CO.type,address:CO.type==='delivery'?addr:'',slot:val('#co_slot'),pay:CO.pay,note:val('#co_note'),status:'New'};
  LAST_ORDER=o;saveOrder(o);
  if(s.orderWebhook){try{fetch(s.orderWebhook,{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/json'},body:JSON.stringify(o)})}catch(e){}}
  CART={};saveCart();updateCartUI();orderSuccess(o);
}
function waOrderMsg(o){
  var L=[];L.push((LANG==='hi'?'नमस्ते! ऑर्डर: ':'Hello! Order: ')+o.id);
  L.push((LANG==='hi'?'नाम: ':'Name: ')+o.name+' | '+(LANG==='hi'?'मोबाइल: ':'Mobile: ')+o.phone);
  L.push(o.type==='delivery'?((LANG==='hi'?'डिलीवरी: ':'Delivery: ')+o.address):(LANG==='hi'?'पिकअप (दुकान से)':'Pickup (from shop)'));
  if(o.slot)L.push((LANG==='hi'?'समय: ':'Time: ')+o.slot);
  L.push((LANG==='hi'?'भुगतान: ':'Payment: ')+(o.pay==='upi'?'UPI':'Cash'));
  L.push('---');
  o.items.forEach(function(it,i){L.push((i+1)+'. '+it.name+(it.unit?' ('+it.unit+')':'')+' x '+it.qty+' = '+money(it.price*it.qty))});
  L.push('---');L.push((LANG==='hi'?'कुल: ':'Total: ')+money(o.total));
  if(o.note)L.push((LANG==='hi'?'नोट: ':'Note: ')+o.note);
  return L.join('\n');
}
function orderSuccess(o){
  var s=DATA.shop||{};var wa=String(s.whatsapp||s.phone||'').replace(/[^0-9]/g,'');
  var rows=o.items.map(function(it){return '<div class="sum"><span>'+esc(it.name)+' \u00D7 '+it.qty+'</span><span>'+money(it.price*it.qty)+'</span></div>'}).join('');
  $('#sheet').setAttribute('data-view','success');
  $('#sheet').innerHTML='<div class="in" style="text-align:center"><div style="font-size:54px">\u2705</div>'+
   '<h2 style="margin:8px 0 3px;font-size:22px;letter-spacing:-.5px">'+t('orderPlaced')+'</h2><div class="note">'+t('orderId')+': <b>'+esc(o.id)+'</b></div>'+
   '<div style="text-align:left;margin-top:16px;background:var(--bg);border-radius:10px;padding:14px">'+rows+
   '<div class="sum"><span>'+t('delivery')+'</span><span>'+(o.delivery?money(o.delivery):t('free'))+'</span></div>'+
   '<div class="sum tot"><span>'+t('total')+'</span><span>'+money(o.total)+'</span></div>'+
   '<div class="note" style="margin-top:8px">'+esc(o.name)+' \u00B7 '+esc(o.phone)+'<br>'+esc(o.type==='delivery'?o.address:t('fromShop'))+'</div></div>'+
   '<div style="margin-top:16px">'+(wa?'<a class="b-wa" style="display:block;margin-bottom:10px;border-radius:6px" href="https://wa.me/'+wa+'?text='+encodeURIComponent(waOrderMsg(o))+'" target="_blank" rel="noopener">'+t('sendWa')+'</a>':'')+
   '<button class="b-call" style="width:100%;border-radius:6px;padding:12px;font-weight:700" onclick="copyText(waOrderMsg(LAST_ORDER))">'+t('copyOrder')+'</button></div>'+
   '<button class="b-brand" style="width:100%;margin-top:10px;border-radius:6px;padding:14px;font-weight:700" onclick="closeOv()">'+t('continueShopping')+'</button></div>';
  openOv();
}
function copyText(x){try{navigator.clipboard.writeText(x);toast(t('copied'))}catch(e){prompt(t('copyNow'),x)}}
function openMyOrders(){
  var os=loadOrders();var body;
  if(!os.length){body='<div class="in"><div class="empty"><div class="big">\uD83D\uDCE6</div><b>'+t('noOrders')+'</b>'+t('noOrdersSub')+'</div></div>'}
  else{body='<div class="in">'+os.slice().reverse().map(function(o){
     return '<div class="ordcard"><div style="display:flex;justify-content:space-between;align-items:center"><b>'+esc(o.id)+'</b><span class="chip">'+esc(o.status||'')+'</span></div><div class="note" style="margin-top:4px">'+new Date(o.at).toLocaleString(LANG==='hi'?'hi-IN':'en-IN',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})+' \u00B7 '+o.cnt+' '+t('items')+'</div><div style="font-weight:700;margin-top:6px">'+money(o.total)+'</div><button class="b-call" style="width:100%;margin-top:10px;border-radius:6px;padding:11px;font-weight:700" onclick="reorder(\''+o.id+'\')">'+t('orderAgain')+'</button></div>';
   }).join('')+'</div>';}
  $('#sheet').setAttribute('data-view','orders');
  $('#sheet').innerHTML='<div class="sh"><b>'+t('myOrders')+'</b><button class="x" onclick="closeOv()">\u2715</button></div>'+body;
  openOv();
}
function reorder(id){var o=loadOrders().filter(function(x){return x.id===id})[0];if(!o)return;o.items.forEach(function(it){var p=(DATA.products||[]).filter(function(x){return x.name===it.name})[0];if(p)CART[p.id]=(CART[p.id]||0)+it.qty});saveCart();closeOv();openCart()}

function showSugg(q){
  var box=$('#sugg');if(!box)return;q=(q||'').toLowerCase().trim();
  if(!q){box.classList.add('hidden');box.innerHTML='';return}
  var ps=(DATA.products||[]).filter(function(p){return ((p.name||'')+' '+(p.brand||'')).toLowerCase().indexOf(q)>-1}).slice(0,6);
  if(!ps.length){box.classList.add('hidden');box.innerHTML='';return}
  box.innerHTML=ps.map(function(p){return '<div class="sug" onclick="pickSugg(\''+esc(p.id)+'\')">'+(p.photo?'<img src="'+esc(p.photo)+'"/>':'<span class="ph">\uD83D\uDED2</span>')+'<div><div class="sn">'+esc(p.name)+'</div><div class="sp">'+money(p.price)+' \u00B7 '+esc(p.unit||'')+'</div></div></div>'}).join('');
  box.classList.remove('hidden');
}
function pickSugg(id){$('#sugg').classList.add('hidden');var p=prodById(id);if(p){$('#q').value=p.name;view.q=p.name;if(tab!=='home'){tab='home';render()}else fillGrid()}}

function openOv(){$('#ov').classList.remove('hidden')}
function closeOv(){$('#ov').classList.add('hidden');$('#sheet').removeAttribute('data-view')}
$('#ov').addEventListener('click',function(e){if(e.target.id==='ov')closeOv()});
var toastTimer=null;
function toast(m){var el=$('#toast');if(!el){el=document.createElement('div');el.id='toast';el.style.cssText='position:fixed;left:50%;bottom:150px;transform:translateX(-50%);background:rgba(0,0,0,.88);color:#fff;padding:11px 18px;border-radius:8px;font-size:13.5px;z-index:80;box-shadow:0 10px 30px rgba(0,0,0,.3);max-width:86%;text-align:center;transition:opacity .25s';document.body.appendChild(el)}
  el.textContent=m;el.style.opacity='1';clearTimeout(toastTimer);toastTimer=setTimeout(function(){el.style.opacity='0'},1800);
}

function updateCartUI(){
  var n=cartCount();var tt=cartTotals();
  var bt=$('#badgeTop');if(bt){if(n>0){bt.textContent=n;bt.classList.remove('hidden')}else bt.classList.add('hidden')}
  var bar=$('#cartbar');
  if(bar){if(n>0){bar.classList.remove('hidden');$('#cbItems').textContent=n+' '+(n===1?t('item'):t('items'));$('#cbTotal').textContent=money(tt.sub)+' \u00B7 '+t('savings')+' '+money(tt.save);$('#cbBtn').textContent=t('viewCart')}else bar.classList.add('hidden')}
  var nb=document.querySelector('#bnav .badge');if(nb){if(n<=0)nb.remove();else nb.textContent=n}
}

$('#q').addEventListener('input',function(e){view.q=e.target.value;showSugg(e.target.value);if(tab!=='home'){tab='home';render()}else fillGrid()});
$('#q').addEventListener('blur',function(){setTimeout(function(){var b=$('#sugg');if(b)b.classList.add('hidden')},220)});
$('#refresh').addEventListener('click',loadData);
$('#cartTop').addEventListener('click',openCart);
$('#langBtn').addEventListener('click',function(){setLang(LANG==='hi'?'en':'hi')});

document.documentElement.lang=(LANG==='hi'?'hi':'en');
loadData();
timer=setInterval(loadData,180000);
document.addEventListener('visibilitychange',function(){if(!document.hidden)loadData()});
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}
</script>
