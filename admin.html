<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#0b7a3b"/>
<title>Admin Panel - Apni Dukaan</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b7a3b'/%3E%3Cpath d='M32 16l3 6 7 1-5 5 1 7-6-3-6 3 1-7-5-5 7-1z' fill='%23fff'/%3E%3C/svg%3E"/>
<style>
:root{--g:#0b7a3b;--g2:#0a6a33;--bg:#f2f5f2;--card:#fff;--tx:#16241b;--mut:#6b7a70;--line:#e2e8e2;--red:#c62828;--amber:#b26a00;--blue:#1565c0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Devanagari",sans-serif;background:var(--bg);color:var(--tx)}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit;width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff;color:var(--tx);outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--g)}
label.f{display:block;font-size:12.5px;color:var(--mut);margin:0 0 4px}
.field{margin-bottom:12px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.hidden{display:none!important}
.gate{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(160deg,var(--g),var(--g2));padding:24px}
.gate .box{background:#fff;border-radius:18px;padding:26px 22px;width:100%;max-width:360px;text-align:center;box-shadow:0 12px 40px rgba(0,0,0,.2)}
.gate .box .ic{font-size:44px}
.gate h2{margin:8px 0 2px;font-size:20px}
.gate p{margin:0 0 18px;color:var(--mut);font-size:13.5px}
header.bar{background:linear-gradient(160deg,var(--g),var(--g2));color:#fff;padding:12px 14px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:20;box-shadow:0 2px 10px rgba(0,0,0,.12)}
header.bar .t{font-weight:700;font-size:16px;line-height:1.1}
header.bar .s{font-size:11.5px;opacity:.9}
header.bar .sp{margin-left:auto;display:flex;gap:8px}
header.bar button{background:rgba(255,255,255,.16);color:#fff;border:0;border-radius:9px;padding:8px 11px;font-size:13px}
nav.tabs{display:flex;gap:4px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:56px;z-index:19;overflow-x:auto;padding:6px 8px}
nav.tabs button{flex:1;white-space:nowrap;border:0;background:transparent;color:var(--mut);padding:9px 10px;border-radius:9px;font-size:13.5px;font-weight:600}
nav.tabs button.on{background:#e7f3ec;color:var(--g)}
main{padding:14px;max-width:920px;margin:0 auto}
h3.sec{margin:4px 0 12px;font-size:16px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:620px){.stats{grid-template-columns:repeat(4,1fr)}}
.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px}
.stat .n{font-size:23px;font-weight:800}
.stat .l{font-size:12px;color:var(--mut);margin-top:2px}
.stat.warn .n{color:var(--amber)}.stat.bad .n{color:var(--red)}.stat.good .n{color:var(--g)}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.btn{background:var(--g);color:#fff;border:0;border-radius:10px;padding:11px 15px;font-weight:700;font-size:14px}
.btn.gray{background:#eef2ee;color:var(--tx)}
.btn.red{background:#fbe9e9;color:var(--red)}
.btn.sm{padding:8px 12px;font-size:13px;border-radius:9px}
.btn.full{width:100%}
.list .it{display:flex;gap:11px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:13px;padding:9px;margin-bottom:9px}
.list .it img,.list .it .ph{width:56px;height:56px;border-radius:10px;object-fit:cover;background:#eef2ee;flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-size:24px;color:#b9c6bd}
.list .it .info{flex:1;min-width:0}
.list .it .nm{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list .it .sub{font-size:12px;color:var(--mut);margin-top:2px}
.list .it .pr{font-weight:800;color:var(--g)}
.pill{font-size:10.5px;font-weight:700;border-radius:6px;padding:2px 6px;margin-left:6px}
.pill.out{background:#fdeaea;color:var(--red)}.pill.low{background:#fff4e0;color:var(--amber)}.pill.in{background:#e7f6ec;color:#0a7d3b}
.ico{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:15px;flex:0 0 auto}
.toolrow{display:flex;gap:9px;align-items:center;margin-bottom:12px}
.toolrow input{flex:1}
.overlay{position:fixed;inset:0;background:rgba(10,20,14,.5);z-index:40;display:flex;justify-content:center;overflow:auto;padding:0}
@media(min-width:620px){.overlay{align-items:flex-start;padding:24px}}
.panel{background:#fff;width:100%;max-width:640px;min-height:100%;border-radius:0}
@media(min-width:620px){.panel{border-radius:16px;min-height:0}}
.panel .ph{position:sticky;top:0;background:#fff;border-bottom:1px solid var(--line);padding:13px 16px;display:flex;align-items:center;gap:10px;z-index:5}
.panel .ph b{font-size:16px}
.panel .pb{padding:16px}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:10px}
.chips .c{background:#eef2ee;border-radius:999px;padding:6px 11px;font-size:13px;display:flex;align-items:center;gap:6px}
.chips .c b{cursor:pointer;color:var(--red)}
.photoBox{display:flex;gap:12px;align-items:center}
.photoBox .prev{width:88px;height:88px;border-radius:12px;background:#eef2ee;object-fit:cover;display:flex;align-items:center;justify-content:center;font-size:30px;color:#b9c6bd;flex:0 0 auto}
.note{font-size:12px;color:var(--mut);line-height:1.55}
.banner{font-size:12.5px;padding:10px 12px;border-radius:10px;margin-bottom:12px;line-height:1.5}
.banner.ok{background:#e7f6ec;color:#0a6a33}.banner.bad{background:#fdeaea;color:var(--red)}.banner.warn{background:#fff4e0;color:var(--amber)}
.switch{display:flex;align-items:center;gap:8px;font-size:14px;margin:8px 0}
.switch input{width:auto}
hr{border:0;border-top:1px solid var(--line);margin:16px 0}
a{color:var(--g)}
.syncbar{font-size:12.5px;color:var(--mut)}
</style>
</head>
<body>

<!-- ===== PIN GATE ===== -->
<div class="gate" id="gate">
  <div class="box">
    <div class="ic">&#128274;</div>
    <h2>Admin Panel</h2>
    <p>Apni Dukaan &mdash; dukaan malik ke liye</p>
    <div class="field"><input id="pinIn" type="password" inputmode="numeric" placeholder="PIN daaliye" style="text-align:center;font-size:20px;letter-spacing:4px"/></div>
    <button class="btn full" id="pinGo">Khuliye</button>
    <p style="margin-top:14px">Pehli baar? Default PIN: <b>1234</b></p>
  </div>
</div>

<!-- ===== APP ===== -->
<div id="app" class="hidden">
  <header class="bar">
    <div><div class="t" id="hName">Apni Dukaan</div><div class="s" id="hSync">Admin Panel</div></div>
    <div class="sp">
      <button id="btnSave" title="Save">&#128190; Save</button>
      <button id="btnLock" title="Lock">&#128274;</button>
    </div>
  </header>
  <nav class="tabs" id="tabs"></nav>
  <main id="view"></main>
</div>

<!-- ===== PRODUCT FORM OVERLAY ===== -->
<div class="overlay hidden" id="formWrap">
  <div class="panel">
    <div class="ph"><b id="formTitle">Naya item</b><span style="margin-left:auto"><button class="ico" onclick="closeForm()">&#10005;</button></span></div>
    <div class="pb" id="formBody"></div>
  </div>
</div>

<script>
var API='https://api.github.com';
var OWNER='itsmkop', REPO='grocery-shop', BRANCH='main', PATH='data.json';
var PUBLIC_URL='https://itsmkop.github.io/grocery-shop/';
var ADMIN_URL='https://itsmkop.github.io/grocery-shop/admin.html';
var CFG_KEY='gs_cfg', DATA_KEY='gs_data', PIN_KEY='gs_pin';
var CFG={owner:OWNER,repo:REPO,branch:BRANCH,path:PATH,token:'',autoPush:true,lastSync:''};
var DATA=null, tab='dash', editId=null, pushTimer=null;

function $(s){return document.querySelector(s)}
function esc(s){return (s==null?'':String(s)).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function money(n){if(n===''||n==null)return '';return (DATA.shop.currency||'\u20B9')+Number(n).toLocaleString('en-IN',{maximumFractionDigits:2})}
function uid(){return 'p'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function b64(s){return btoa(unescape(encodeURIComponent(s)))}
function daysLeft(d){if(!d)return null;var t=new Date();t.setHours(0,0,0,0);var e=new Date(d);if(isNaN(e))return null;e.setHours(0,0,0,0);return Math.round((e-t)/86400000)}
function fmtDate(d){if(!d)return '';var e=new Date(d);if(isNaN(e))return d;return e.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'})}
function timeNow(){return new Date().toLocaleString('en-IN',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})}

function DEFAULT(){
  return {meta:{version:1,updatedAt:new Date().toISOString()},
    shop:{name:'Apni Dukaan',owner:'',phone:'',whatsapp:'',address:'',tagline:'Aapki apni grocery shop',upi:'',gstin:'',hours:'8:00 AM - 9:00 PM',logo:'',currency:'\u20B9',lowStock:5,expiryDays:30,
      categories:['Atta & Rice','Dal & Pulses','Oil & Ghee','Masala & Spices','Snacks','Dairy','Beverages','Personal Care','Household','Other']},
    products:[]};
}

/* ---------- storage ---------- */
function loadCfg(){try{var c=JSON.parse(localStorage.getItem(CFG_KEY));if(c)CFG=Object.assign(CFG,c)}catch(e){}}
function saveCfg(){try{localStorage.setItem(CFG_KEY,JSON.stringify(CFG))}catch(e){}}
function loadData(){try{var d=JSON.parse(localStorage.getItem(DATA_KEY));if(d&&d.products)DATA=d;else DATA=DEFAULT()}catch(e){DATA=DEFAULT()}}
function saveData(){DATA.meta=DATA.meta||{};DATA.meta.updatedAt=new Date().toISOString();try{localStorage.setItem(DATA_KEY,JSON.stringify(DATA))}catch(e){alert('Data bahut bada ho gaya (photos kam kijiye).')};schedulePush()}

/* ---------- login ---------- */
function getPin(){return localStorage.getItem(PIN_KEY)||'1234'}
function unlock(){sessionStorage.setItem('gs_open','1');$('#gate').classList.add('hidden');$('#app').classList.remove('hidden');boot()}
$('#pinGo').onclick=function(){if($('#pinIn').value.trim()===getPin())unlock();else{alert('Galat PIN')}};
$('#pinIn').addEventListener('keydown',function(e){if(e.key==='Enter')$('#pinGo').click()});
$('#btnLock').onclick=function(){sessionStorage.removeItem('gs_open');location.reload()};
$('#btnSave').onclick=function(){saveData();cloudPush(false)};

/* ---------- tabs ---------- */
var TABS=[['dash','\uD83D\uDCCA Dashboard'],['prod','\uD83D\uDCE6 Items'],['cats','\uD83C\uDFF7\uFE0F Category'],['set','\u2699\uFE0F Dukaan'],['cloud','\u2601\uFE0F Cloud']];
function renderTabs(){$('#tabs').innerHTML=TABS.map(function(t){return '<button class="'+(tab===t[0]?'on':'')+'" data-t="'+t[0]+'">'+t[1]+'</button>'}).join('');
  [].forEach.call($('#tabs').children,function(b){b.onclick=function(){tab=b.getAttribute('data-t');renderTabs();render()}});}
function render(){$('#hName').textContent=DATA.shop.name||'Apni Dukaan';
  if(tab==='dash')renderDash();else if(tab==='prod')renderProd();else if(tab==='cats')renderCats();else if(tab==='set')renderSet();else renderCloud();}

/* ---------- dashboard ---------- */
function stockInfo(p){var low=DATA.shop.lowStock||5;if(p.available===false||p.stock===0||p.stock==='0')return{k:'out',t:'Khatam'};if(p.stock!==''&&p.stock!=null&&Number(p.stock)<=low)return{k:'low',t:'Sirf '+p.stock};return{k:'in',t:'Stock me'}}
function renderDash(){
  var ps=DATA.products||[];var out=0,low=0,soon=0,val=0;
  ps.forEach(function(p){var s=stockInfo(p);if(s.k==='out')out++;else if(s.k==='low')low++;var dl=daysLeft(p.expiry);if(dl!=null&&dl<=(DATA.shop.expiryDays||30))soon++;val+=(Number(p.price)||0)*(Number(p.stock)||0)});
  var expSoon=ps.filter(function(p){var dl=daysLeft(p.expiry);return dl!=null&&dl<=(DATA.shop.expiryDays||30)}).slice(0,6);
  var lowList=ps.filter(function(p){return stockInfo(p).k!=='in'}).slice(0,6);
  $('#view').innerHTML=
   '<div class="stats">'+
   stat('good',ps.length,'Total items')+
   stat('',val?'\u20B9'+Math.round(val).toLocaleString('en-IN'):'\u20B9 0','Stock ki value')+
   stat('warn',low,'Kam stock')+
   stat('bad',out,'Khatam')+
   '</div>'+
   (soon?'<div class="banner warn" style="margin-top:14px">\u23F0 '+soon+' item jaldi expire hone wale hain. Neeche dekhiye.</div>':'')+
   '<div class="card" style="margin-top:14px"><h3 class="sec">Jaldi expire hone wale</h3>'+(expSoon.length?expSoon.map(function(p){return '<div class="list"><div class="it"><div class="info"><div class="nm">'+esc(p.name)+'</div><div class="sub">Expiry: '+fmtDate(p.expiry)+'</div></div></div></div>'}).join(''):'<div class="note">Koi nahi.</div>')+'</div>'+
   '<div class="card"><h3 class="sec">Kam / khatam stock</h3>'+(lowList.length?lowList.map(function(p){return '<div class="list"><div class="it"><div class="info"><div class="nm">'+esc(p.name)+'</div><div class="sub">'+stockInfo(p).t+'</div></div></div></div>'}).join(''):'<div class="note">Sab theek hai.</div>')+'</div>'+
   '<button class="btn full" onclick="openForm()">\u2795 Naya item jodein</button>';
}
function stat(cls,n,l){return '<div class="stat '+cls+'"><div class="n">'+n+'</div><div class="l">'+l+'</div></div>'}

/* ---------- products ---------- */
var pQuery='';
function renderProd(){
  var ps=(DATA.products||[]).slice();
  if(pQuery){var q=pQuery.toLowerCase();ps=ps.filter(function(p){return ((p.name||'')+' '+(p.brand||'')+' '+(p.barcode||'')+' '+(p.category||'')).toLowerCase().indexOf(q)>-1})}
  ps.sort(function(a,b){return (a.name||'').localeCompare(b.name||'')});
  var list=ps.length?ps.map(itemHTML).join(''):'<div class="note" style="padding:20px;text-align:center">Koi item nahi. "Naya item jodein" dabaiye.</div>';
  $('#view').innerHTML='<div class="toolrow"><input id="pq" placeholder="Naam / brand / barcode se dhundein" value="'+esc(pQuery)+'"/><button class="btn" onclick="openForm()">\u2795</button></div>'+
    '<div class="note" style="margin-bottom:10px">'+ps.length+' item</div><div class="list">'+list+'</div>';
  var pq=$('#pq');pq.oninput=function(){pQuery=pq.value;var pos=pq.selectionStart;renderProd();var n=$('#pq');n.focus();try{n.setSelectionRange(pos,pos)}catch(e){}};
}
function itemHTML(p){
  var s=stockInfo(p);var dl=daysLeft(p.expiry);
  var exp=dl!=null?(dl<0?'<span class="pill out">Expired</span>':(dl<=(DATA.shop.expiryDays||30)?'<span class="pill low">'+dl+'d</span>':'')):'';
  var img=p.photo?'<img src="'+esc(p.photo)+'"/>':'<div class="ph">\uD83D\uDED2</div>';
  return '<div class="it" data-id="'+esc(p.id)+'">'+img+
   '<div class="info"><div class="nm">'+esc(p.name)+(p.brand?' <span style="font-weight:400;color:#6b7a70">'+esc(p.brand)+'</span>':'')+'</div>'+
   '<div class="sub"><span class="pr">'+money(p.price)+'</span> '+esc(p.unit||'')+' <span class="pill '+s.k+'">'+s.t+'</span>'+exp+'</div></div>'+
   '<button class="ico" data-act="minus">\u2212</button><button class="ico" data-act="plus">+</button>'+
   '<button class="ico" data-act="edit">\u270E</button></div>';
}
document.addEventListener('click',function(e){
  var b=e.target.closest?e.target.closest('[data-act]'):null;if(!b)return;
  var it=b.closest('.it');if(!it)return;var id=it.getAttribute('data-id');
  var p=(DATA.products||[]).filter(function(x){return x.id===id})[0];if(!p)return;
  var act=b.getAttribute('data-act');
  if(act==='edit')openForm(id);
  else if(act==='plus'){p.stock=(Number(p.stock)||0)+1;saveData();renderProd()}
  else if(act==='minus'){p.stock=Math.max(0,(Number(p.stock)||0)-1);saveData();renderProd()}
});

/* ---------- product form ---------- */
function catOptions(sel){return (DATA.shop.categories||[]).map(function(c){return '<option'+(c===sel?' selected':'')+'>'+esc(c)+'</option>'}).join('')}
function openForm(id){
  editId=id||null;
  var p=id?(DATA.products||[]).filter(function(x){return x.id===id})[0]:{name:'',category:(DATA.shop.categories||[])[0]||'',brand:'',unit:'',price:'',mrp:'',cost:'',gst:'',stock:'',barcode:'',hsn:'',supplier:'',expiry:'',batch:'',tags:'',desc:'',photo:'',available:true,featured:false};
  $('#formTitle').textContent=id?'Item badlein':'Naya item';
  $('#formBody').innerHTML=
   '<div class="field"><label class="f">Naam *</label><input id="f_name" value="'+esc(p.name)+'" placeholder="jaise: Aashirvaad Atta"/></div>'+
   '<div class="row2"><div class="field"><label class="f">Category</label><select id="f_category">'+catOptions(p.category)+'</select></div>'+
   '<div class="field"><label class="f">Brand</label><input id="f_brand" value="'+esc(p.brand)+'" placeholder="Aashirvaad"/></div></div>'+
   '<div class="field"><label class="f">Photo</label><div class="photoBox"><div class="prev" id="f_prev">'+(p.photo?'<img src="'+esc(p.photo)+'" style="width:100%;height:100%;object-fit:cover;border-radius:12px"/>':'\uD83D\uDCF7')+'</div><div style="flex:1"><input type="file" accept="image/*" id="f_file"/><div class="note" style="margin-top:6px">Ya photo ka link:</div><input id="f_photoUrl" placeholder="https://..." value="'+(p.photo&&p.photo.slice(0,5)!=='data:'?esc(p.photo):'')+'" style="margin-top:4px"/><input type="hidden" id="f_photo" value="'+esc(p.photo)+'"/></div></div></div>'+
   '<div class="row3"><div class="field"><label class="f">Price *</label><input id="f_price" inputmode="decimal" value="'+esc(p.price)+'"/></div>'+
   '<div class="field"><label class="f">MRP</label><input id="f_mrp" inputmode="decimal" value="'+esc(p.mrp)+'"/></div>'+
   '<div class="field"><label class="f">Pack/Unit</label><input id="f_unit" value="'+esc(p.unit)+'" placeholder="1 kg / 500 g"/></div></div>'+
   '<div class="row3"><div class="field"><label class="f">Stock</label><input id="f_stock" inputmode="numeric" value="'+esc(p.stock)+'"/></div>'+
   '<div class="field"><label class="f">Expiry date</label><input id="f_expiry" type="date" value="'+esc(p.expiry)+'"/></div>'+
   '<div class="field"><label class="f">GST %</label><input id="f_gst" inputmode="decimal" value="'+esc(p.gst)+'"/></div></div>'+
   '<div class="row3"><div class="field"><label class="f">Barcode</label><input id="f_barcode" value="'+esc(p.barcode)+'"/></div>'+
   '<div class="field"><label class="f">HSN code</label><input id="f_hsn" value="'+esc(p.hsn)+'"/></div>'+
   '<div class="field"><label class="f">Batch no.</label><input id="f_batch" value="'+esc(p.batch)+'"/></div></div>'+
   '<div class="row2"><div class="field"><label class="f">Purchase rate</label><input id="f_cost" inputmode="decimal" value="'+esc(p.cost)+'"/></div>'+
   '<div class="field"><label class="f">Supplier</label><input id="f_supplier" value="'+esc(p.supplier)+'"/></div></div>'+
   '<div class="field"><label class="f">Tags (comma se)</label><input id="f_tags" value="'+esc(p.tags)+'" placeholder="atta, gehu, 5kg"/></div>'+
   '<div class="field"><label class="f">Details / note</label><textarea id="f_desc" rows="2">'+esc(p.desc)+'</textarea></div>'+
   '<label class="switch"><input type="checkbox" id="f_available"'+(p.available===false?'':' checked')+'/> Stock me hai (available)</label>'+
   '<label class="switch"><input type="checkbox" id="f_featured"'+(p.featured?' checked':'')+'/> \u2B50 Top / featured (public app me highlight)</label>'+
   '<hr/><div style="display:flex;gap:10px">'+(id?'<button class="btn red" onclick="delProduct()">\uD83D\uDDD1 Delete</button>':'')+'<button class="btn" style="flex:1" onclick="saveForm()">Save</button></div>';
  $('#f_file').onchange=onPhoto;
  $('#f_photoUrl').oninput=function(){var u=this.value.trim();if(u){$('#f_photo').value=u;$('#f_prev').innerHTML='<img src="'+esc(u)+'" style="width:100%;height:100%;object-fit:cover;border-radius:12px"/>'}};
  $('#formWrap').classList.remove('hidden');
}
function closeForm(){$('#formWrap').classList.add('hidden');editId=null}
function onPhoto(e){var f=e.target.files[0];if(!f)return;compress(f,600,0.6,function(url){$('#f_photo').value=url;$('#f_prev').innerHTML='<img src="'+url+'" style="width:100%;height:100%;object-fit:cover;border-radius:12px"/>'})}
function compress(file,maxDim,q,cb){
  var r=new FileReader();r.onload=function(){var img=new Image();img.onload=function(){
    var w=img.width,h=img.height;var s=Math.min(1,maxDim/Math.max(w,h));w=Math.round(w*s);h=Math.round(h*s);
    var c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);
    cb(c.toDataURL('image/jpeg',q));};img.src=r.result};r.readAsDataURL(file);
}
function val(id){var e=$(id);return e?e.value.trim():''}
function saveForm(){
  var name=val('#f_name');if(!name){alert('Naam zaroori hai');return}
  var p=editId?(DATA.products||[]).filter(function(x){return x.id===editId})[0]:{id:uid(),createdAt:new Date().toISOString()};
  p.name=name;p.category=val('#f_category');p.brand=val('#f_brand');p.photo=val('#f_photo');
  p.price=val('#f_price');p.mrp=val('#f_mrp');p.unit=val('#f_unit');p.stock=val('#f_stock');p.expiry=val('#f_expiry');p.gst=val('#f_gst');
  p.barcode=val('#f_barcode');p.hsn=val('#f_hsn');p.batch=val('#f_batch');p.cost=val('#f_cost');p.supplier=val('#f_supplier');
  p.tags=val('#f_tags');p.desc=val('#f_desc');p.available=$('#f_available').checked;p.featured=$('#f_featured').checked;p.updatedAt=new Date().toISOString();
  if(!editId)DATA.products.push(p);
  saveData();closeForm();render();
}
function delProduct(){if(!confirm('Ye item delete karna hai?'))return;DATA.products=(DATA.products||[]).filter(function(x){return x.id!==editId});saveData();closeForm();render()}

/* ---------- categories ---------- */

  $('#view').innerHTML='<h3 class="sec">Category manage</h3><div class="card"><div class="chips">'+(DATA.shop.categories||[]).map(function(c,i){return '<span class="c">'+esc(c)+' <b data-del="'+i+'">\u2715</b></span>'}).join('')+'</div>'+
   '<div class="row2"><input id="newCat" placeholder="Nayi category"/><button class="btn" onclick="addCat()">Jodein</button></div></div>'+

function addCat(){var v=$('#newCat').value.trim();if(!v)return;DATA.shop.categories=DATA.shop.categories||[];if(DATA.shop.categories.indexOf(v)<0)DATA.shop.categories.push(v);saveData();renderCats()}

  $('#s_logoFile').onchange=function(e){var f=e.target.files[0];if(f)compress(f,300,0.7,function(u){$('#s_logo').value=u;$('#s_prev').innerHTML='<img src="'+u+'" style="width:100%;height:100%;object-fit:cover;border-radius:12px"/>'})};
  $('#impFile').onchange=function(e){var f=e.target.files[0];if(!f)return;var r=new FileReader();r.onload=function(){try{DATA=JSON.parse(r.result);saveData();render()}catch(x){alert('File galat hai')}};r.readAsText(f)};
}
function saveSet(){
  var s=DATA.shop;
  s.name=val('#s_name');s.tagline=val('#s_tagline');s.logo=val('#s_logo');s.phone=val('#s_phone');s.whatsapp=val('#s_whatsapp');
  s.address=val('#s_address');s.hours=val('#s_hours');s.upi=val('#s_upi');s.gstin=val('#s_gstin');s.lowStock=Number(val('#s_low'))||5;s.expiryDays=Number(val('#s_exp'))||30;s.currency=val('#s_cur')||'\u20B9';

function changePin(){var v=$('#newPin').value.trim();if(v.length<4){alert('Kam se kam 4 ank');return}localStorage.setItem(PIN_KEY,v);$('#newPin').value='';alert('PIN badal gaya \u2713')}
function exportJSON(){dl('grocery-backup.json',JSON.stringify(DATA,null,2))}
function exportCSV(){var ps=DATA.products||[];var cols=['name','brand','category','unit','price','mrp','cost','gst','stock','expiry','barcode','hsn','batch','supplier','tags','desc','available','featured'];var rows=[cols.join(',')];ps.forEach(function(p){rows.push(cols.map(function(c){var v=p[c]==null?'':String(p[c]);return '"'+v.replace(/"/g,'""')+'"'}).join(','))});dl('grocery-items.csv',rows.join('\n'))}
function dl(name,text){var b=new Blob([text],{type:'application/octet-stream'});var a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;a.click()}

/* ---------- cloud sync ---------- */
function renderCloud(){
  var ready=!!CFG.token;
  $('#view').innerHTML=
   '<div class="banner '+(ready?'ok':'warn')+'">'+(ready?'\u2705 Cloud juda hua hai. Data apne-aap online save hota hai.'+ (CFG.lastSync?' Last: '+timeNow():'') :'\u26A0\uFE0F Ek baar GitHub token daaliye, uske baad sab automatic chalega.')+'</div>'+
   '<div class="card"><h3 class="sec">Cloud settings</h3>'+
   '<div class="note" style="margin-bottom:10px">Owner: <b>'+esc(CFG.owner)+'</b> &middot; Repo: <b>'+esc(CFG.repo)+'</b> &middot; File: <b>'+esc(CFG.path)+'</b></div>'+
   '<div class="field"><label class="f">GitHub Token (ek baar)</label><input id="c_token" type="password" placeholder="ghp_... ya github_pat_..." value="'+esc(CFG.token)+'"/></div>'+
   '<label class="switch"><input type="checkbox" id="c_auto"'+(CFG.autoPush?' checked':'')+'/> Har save par apne-aap online bhejein (auto-sync)</label>'+
   '<div style="display:flex;gap:9px;flex-wrap:wrap;margin-top:10px"><button class="btn" onclick="saveCloud()">Save token</button><button class="btn gray" onclick="cloudPush(false)">\u2601 Push (bhejein)</button><button class="btn gray" onclick="cloudPull()">\u2B07 Pull (laein)</button></div>'+
   '<div class="syncbar" id="syncMsg" style="margin-top:10px">'+esc(syncMsg||'')+'</div></div>'+
   '<div class="card"><h3 class="sec">Public app link (grahako ko bhejein)</h3><div class="note" style="word-break:break-all;margin-bottom:8px">'+PUBLIC_URL+'</div><div style="display:flex;gap:9px;flex-wrap:wrap"><button class="btn gray sm" onclick="copy(\''+PUBLIC_URL+'\')">Copy link</button><a class="btn gray sm" href="'+PUBLIC_URL+'" target="_blank" style="text-decoration:none">Kholkar dekhein</a></div></div>'+
   '<div class="card"><h3 class="sec">Token kaise banayein (ek baar)</h3><div class="note">1. github.com par login karein \u2192 Settings.<br>2. Developer settings \u2192 Personal access tokens \u2192 <b>Tokens (classic)</b>.<br>3. <b>Generate new token (classic)</b> dabaiye.<br>4. Note me "grocery app" likhein, Expiration me 90 days ya No expiration chunein.<br>5. Scope me sirf <b>public_repo</b> ko tick karein.<br>6. Generate \u2192 token copy karein \u2192 upar box me paste karke Save dabaiye.<br><br>Ye token sirf isi phone/browser me safe rehta hai.</div></div>';
  $('#c_auto').onchange=function(){CFG.autoPush=this.checked;saveCfg()};
}
var syncMsg='';
function setSync(m){syncMsg=m;var e=$('#syncMsg');if(e)e.textContent=m}
function saveCloud(){CFG.token=val('#c_token');CFG.autoPush=$('#c_auto').checked;saveCfg();setSync(CFG.token?'Token save ho gaya \u2713':'Token khali hai');renderCloud()}
function copy(t){try{navigator.clipboard.writeText(t);alert('Copy ho gaya \u2713')}catch(e){prompt('Copy karein:',t)}}
async function cloudPush(silent){
  if(!CFG.token){if(!silent)alert('Pehle Cloud tab me GitHub token daaliye.');return}
  setSync('Online bheja ja raha hai...');
  try{
    var base=API+'/repos/'+CFG.owner+'/'+CFG.repo;
    var H={'Authorization':'Bearer '+CFG.token,'Accept':'application/vnd.github+json','Content-Type':'application/json'};
    var json=JSON.stringify(DATA);
    var br=await fetch(base+'/git/blobs',{method:'POST',headers:H,body:JSON.stringify({content:b64(json),encoding:'base64'})});
    if(!br.ok)throw new Error('blob '+br.status);var blob=await br.json();
    var rr=await fetch(base+'/git/ref/heads/'+CFG.branch,{headers:H});if(!rr.ok)throw new Error('ref '+rr.status);var ref=await rr.json();var parent=ref.object.sha;
    var cr=await fetch(base+'/git/commits/'+parent,{headers:H});var co=await cr.json();
    var tr=await fetch(base+'/git/trees',{method:'POST',headers:H,body:JSON.stringify({base_tree:co.tree.sha,tree:[{path:CFG.path,mode:'100644',type:'blob',sha:blob.sha}]})});var tree=await tr.json();
    var ncr=await fetch(base+'/git/commits',{method:'POST',headers:H,body:JSON.stringify({message:'Update inventory '+new Date().toISOString(),tree:tree.sha,parents:[parent]})});var nc=await ncr.json();
    var ur=await fetch(base+'/git/refs/heads/'+CFG.branch,{method:'PATCH',headers:H,body:JSON.stringify({sha:nc.sha})});
    if(!ur.ok)throw new Error('update '+ur.status);
    CFG.lastSync=new Date().toISOString();saveCfg();setSync('\u2705 Online save ho gaya \u2014 '+timeNow());
  }catch(e){setSync('\u274C Error: '+e.message);if(!silent)alert('Push fail: '+e.message+'\n\nToken check kijiye (public_repo scope).')}
}
async function cloudPull(){
  if(!CFG.token){alert('Pehle token daaliye.');return}
  setSync('Online se laa rahe hain...');
  try{
    var url='https://raw.githubusercontent.com/'+CFG.owner+'/'+CFG.repo+'/'+CFG.branch+'/'+CFG.path+'?t='+Date.now();
    var r=await fetch(url,{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);
    DATA=await r.json();try{localStorage.setItem(DATA_KEY,JSON.stringify(DATA))}catch(e){};render();setSync('\u2705 Online se aa gaya \u2014 '+timeNow());
  }catch(e){setSync('\u274C Error: '+e.message)}
}
function schedulePush(){if(!CFG.autoPush||!CFG.token)return;clearTimeout(pushTimer);pushTimer=setTimeout(function(){cloudPush(true)},1800)}

/* ---------- boot ---------- */
function boot(){loadCfg();loadData();renderTabs();render();setSync(CFG.lastSync?'Last sync: '+timeNow():'');}
loadCfg();loadData();
if(sessionStorage.getItem('gs_open')==='1')unlock();else{$('#pinIn').focus()}
</script>
