<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>

<style>
:root{--bg:#F2F2F7;--card:#fff;--tx:#000;--tx2:#3C3C43;--mut:#8E8E93;--sep:rgba(60,60,67,.16);--accent:#007AFF;--accent2:#0A84FF;--soft:rgba(0,122,255,.12);--green:#34C759;--red:#FF3B30;--amber:#FF9F0A;--fill:rgba(118,118,128,.12);--sh:0 1px 2px rgba(0,0,0,.05),0 10px 30px rgba(0,0,0,.06);--sh2:0 20px 50px rgba(0,0,0,.22);--ease:cubic-bezier(.32,.72,0,1)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Segoe UI",Roboto,"Noto Sans Devanagari",sans-serif;background:var(--bg);color:var(--tx);-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit;transition:transform .18s var(--ease),opacity .18s var(--ease)}
button:active{transform:scale(.96)}
input,select,textarea{font:inherit;width:100%;border:0;background:var(--fill);border-radius:13px;padding:13px 14px;font-size:16px;color:var(--tx);outline:none;transition:box-shadow .18s,background .18s}
input:focus,select:focus,textarea:focus{background:#fff;box-shadow:0 0 0 3px rgba(0,122,255,.25)}
.hidden{display:none!important}
label.f{display:block;font-size:12.5px;color:var(--mut);margin:0 2px 7px;font-weight:500;text-transform:uppercase;letter-spacing:.4px}
.field{margin-bottom:14px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:11px}
@media(max-width:520px){.row3{grid-template-columns:1fr 1fr}}
/* gate */
.gate{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(160deg,#0A84FF,#0060DF);padding:24px}
.gate .box{background:#fff;border-radius:24px;padding:30px 24px;width:100%;max-width:360px;text-align:center;box-shadow:var(--sh2);animation:pop .35s var(--ease)}
.gate .ic{font-size:44px}
.gate h2{margin:8px 0 3px;font-size:22px;letter-spacing:-.5px}
.gate p{margin:0 0 20px;color:var(--mut);font-size:14px}
/* header */
header.bar{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.8);backdrop-filter:saturate(180%) blur(22px);-webkit-backdrop-filter:saturate(180%) blur(22px);border-bottom:.5px solid var(--sep);padding:12px 16px;display:flex;align-items:center;gap:10px}
header.bar .t{font-size:18px;font-weight:700;letter-spacing:-.4px;line-height:1.15}
header.bar .s{font-size:12px;color:var(--mut);display:flex;align-items:center;gap:5px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--green)}
.dot.off{background:var(--amber)}
header.bar .sp{margin-left:auto;display:flex;gap:8px;align-items:center}
.lang{font-size:13px;font-weight:700;color:var(--accent);background:var(--soft);border-radius:999px;padding:7px 12px}
.icobtn{width:40px;height:40px;border-radius:999px;background:var(--fill);display:flex;align-items:center;justify-content:center;color:var(--tx)}
.icobtn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
/* tabs */
nav.tabs{position:sticky;top:64px;z-index:39;background:rgba(242,242,247,.92);backdrop-filter:blur(20px);padding:9px 12px;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;border-bottom:.5px solid var(--sep)}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{white-space:nowrap;background:#fff;color:var(--tx2);border-radius:999px;padding:9px 15px;font-size:14px;font-weight:600;box-shadow:var(--sh);transition:background .2s var(--ease),color .2s}
nav.tabs button.on{background:var(--accent);color:#fff}
main{padding:14px;max-width:940px;margin:0 auto}
h3.sec{margin:6px 4px 12px;font-size:16px;font-weight:700;letter-spacing:-.3px}
/* stats */
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:620px){.stats{grid-template-columns:repeat(4,1fr)}}
.stat{background:#fff;border-radius:18px;padding:16px;box-shadow:var(--sh);animation:pop .3s var(--ease) both}
.stat .n{font-size:24px;font-weight:700;letter-spacing:-.6px}
.stat .l{font-size:12.5px;color:var(--mut);margin-top:3px}
.stat.warn .n{color:var(--amber)}.stat.bad .n{color:var(--red)}.stat.good .n{color:var(--green)}
.card{background:#fff;border-radius:18px;padding:16px;margin-bottom:12px;box-shadow:var(--sh);animation:slideUp .34s var(--ease) both}
.btn{background:var(--accent);color:#fff;border-radius:13px;padding:13px 18px;font-weight:700;font-size:15px}
.btn.gray{background:var(--fill);color:var(--tx)}
.btn.red{background:rgba(255,59,48,.12);color:var(--red)}
.btn.green{background:var(--green);color:#fff}
.btn.sm{padding:9px 13px;font-size:13.5px;border-radius:11px}
.btn.full{width:100%}
.list .it{display:flex;gap:12px;align-items:center;background:#fff;border-radius:16px;padding:10px;margin-bottom:10px;box-shadow:var(--sh);animation:pop .3s var(--ease) both}
.list .it img,.list .it .ph{width:58px;height:58px;border-radius:13px;object-fit:cover;background:var(--fill);flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-size:24px;color:var(--mut)}
.list .it .info{flex:1;min-width:0}
.list .it .nm{font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.2px}
.list .it .sub{font-size:12.5px;color:var(--mut);margin-top:3px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.list .it .pr{font-weight:700;color:var(--tx)}
.pill{font-size:10.5px;font-weight:700;border-radius:999px;padding:3px 9px}
.pill.out{background:rgba(255,59,48,.14);color:var(--red)}.pill.low{background:rgba(255,159,10,.16);color:var(--amber)}.pill.in{background:rgba(52,199,89,.16);color:var(--green)}
.ico{width:36px;height:36px;border-radius:999px;border:0;background:var(--fill);display:inline-flex;align-items:center;justify-content:center;font-size:15px;flex:0 0 auto;color:var(--tx)}
.toolrow{display:flex;gap:10px;align-items:center;margin-bottom:14px}
.toolrow input{flex:1}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:50;display:flex;justify-content:center;overflow:auto;animation:fade .25s ease}
@media(min-width:620px){.overlay{align-items:flex-start;padding:26px}}
.panel{background:#fff;width:100%;max-width:640px;min-height:100%;animation:sheetUp .4s var(--ease)}
@media(min-width:620px){.panel{border-radius:22px;min-height:0;animation:pop .3s var(--ease)}}
.panel .ph{position:sticky;top:0;background:rgba(255,255,255,.92);backdrop-filter:blur(20px);border-bottom:.5px solid var(--sep);padding:15px 16px;display:flex;align-items:center;gap:10px;z-index:5}
.panel .ph b{font-size:17px;font-weight:700;letter-spacing:-.3px}
.panel .pb{padding:16px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.chips .c{background:var(--fill);border-radius:999px;padding:8px 13px;font-size:14px;display:flex;align-items:center;gap:8px}
.chips .c b{cursor:pointer;color:var(--red)}
.photoBox{display:flex;gap:13px;align-items:center}
.photoBox .prev{width:92px;height:92px;border-radius:16px;background:var(--fill);object-fit:cover;display:flex;align-items:center;justify-content:center;font-size:30px;color:var(--mut);flex:0 0 auto;overflow:hidden}
.note{font-size:12.5px;color:var(--mut);line-height:1.55}
.banner{font-size:13px;padding:12px 14px;border-radius:14px;margin-bottom:12px;line-height:1.5}
.banner.ok{background:rgba(52,199,89,.14);color:#1c7a3a}.banner.bad{background:rgba(255,59,48,.12);color:var(--red)}.banner.warn{background:rgba(255,159,10,.15);color:#9a6400}
.switch{display:flex;align-items:center;gap:10px;font-size:15px;margin:11px 0}
.switch input{width:auto}
.seg{display:flex;gap:2px;background:var(--fill);border-radius:12px;padding:3px}
.seg button{flex:1;border-radius:9px;padding:10px;font-size:14px;font-weight:600;color:var(--tx2)}
.seg button.on{background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.12);color:var(--tx)}
hr{border:0;border-top:.5px solid var(--sep);margin:16px 0}
a{color:var(--accent)}
.syncbar{font-size:13px;color:var(--mut)}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:scale(1)}}
@keyframes sheetUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes slideUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div class="gate" id="gate">
  <div class="box">
    <div class="ic">&#128274;</div>
    <h2 id="gateTitle">Admin Panel</h2>
    <p id="gateSub">Shop owner area</p>
    <div class="field"><input id="pinIn" type="password" inputmode="numeric" style="text-align:center;font-size:22px;letter-spacing:6px"/></div>
    <button class="btn full" id="pinGo">Unlock</button>
    <p id="gateHint" style="margin-top:16px">First time? Default PIN: <b>1234</b></p>
  </div>
</div>

<div id="app" class="hidden">
  <header class="bar">
    <div style="min-width:0">
      <div class="t" id="hName">Apni Dukaan</div>
      <div class="s"><span class="dot" id="hDot"></span><span id="hSync">Admin</span></div>
    </div>
    <div class="sp">
      <button class="lang" id="langBtn">EN</button>
      <button class="btn sm" id="btnSave">Save</button>
      <button class="icobtn" id="btnLock" aria-label="Lock"><svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></button>
    </div>
  </header>
  <nav class="tabs" id="tabs"></nav>
  <main id="view"></main>
</div>

<div class="overlay hidden" id="formWrap">
  <div class="panel">
    <div class="ph"><b id="formTitle">New item</b><span style="margin-left:auto"><button class="icobtn" onclick="closeForm()">&#10005;</button></span></div>
    <div class="pb" id="formBody"></div>
  </div>
</div>

function $(s){return document.querySelector(s)}
function esc(s){return (s==null?'':String(s)).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function money(n){if(n===''||n==null)return '';return (DATA.shop.currency||'\u20B9')+Number(n).toLocaleString('en-IN',{maximumFractionDigits:2})}
function uid(){return 'p'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function b64(s){return btoa(unescape(encodeURIComponent(s)))}
function daysLeft(d){if(!d)return null;var t=new Date();t.setHours(0,0,0,0);var e=new Date(d);if(isNaN(e))return null;e.setHours(0,0,0,0);return Math.round((e-t)/86400000)}
function fmtDate(d){if(!d)return '';var e=new Date(d);if(isNaN(e))return d;return e.toLocaleDateString(LANG==='hi'?'hi-IN':'en-IN',{day:'2-digit',month:'short',year:'numeric'})}
function timeNow(){return new Date().toLocaleString(LANG==='hi'?'hi-IN':'en-IN',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})}
function fmtSync(){if(!CFG.lastSync)return '';try{return new Date(CFG.lastSync).toLocaleString(LANG==='hi'?'hi-IN':'en-IN',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})}catch(e){return ''}}
function DEFAULT(){return {meta:{version:1,updatedAt:new Date().toISOString()},shop:{name:'Apni Dukaan',owner:'',phone:'',whatsapp:'',address:'',tagline:'',upi:'',gstin:'',hours:'',logo:'',currency:'\u20B9',lowStock:5,expiryDays:30,offerBanner:'',deliveryNote:'',deliveryCharge:0,orderWebhook:'',ordersUrl:'',categories:['Atta & Rice','Dal & Pulses','Oil & Ghee','Masala & Spices','Snacks','Dairy','Beverages','Personal Care','Household','Other']},products:[]}}

function loadCfg(){try{var c=JSON.parse(localStorage.getItem(CFG_KEY));if(c)CFG=Object.assign(CFG,c)}catch(e){}}
function saveCfg(){try{localStorage.setItem(CFG_KEY,JSON.stringify(CFG))}catch(e){}}
function loadData(){try{var d=JSON.parse(localStorage.getItem(DATA_KEY));if(d&&d.products)DATA=d;else DATA=DEFAULT()}catch(e){DATA=DEFAULT()}}
function saveData(){DATA.meta=DATA.meta||{};DATA.meta.updatedAt=new Date().toISOString();try{localStorage.setItem(DATA_KEY,JSON.stringify(DATA))}catch(e){alert(t('badFile'))};schedulePush()}

function getPin(){return localStorage.getItem(PIN_KEY)||'1234'}
function unlock(){sessionStorage.setItem('gs_open','1');$('#gate').classList.add('hidden');$('#app').classList.remove('hidden');boot2()}
$('#pinGo').onclick=function(){if($('#pinIn').value.trim()===getPin())unlock();else{alert(t('wrongPin'))}};

$('#btnLock').onclick=function(){sessionStorage.removeItem('gs_open');location.reload()};
$('#btnSave').onclick=function(){saveData();if(CFG.token){cloudPush(false)}else{syncMsg=t('localSaved');tab='cloud';renderTabs();render()}};
$('#langBtn').onclick=function(){setLang(LANG==='hi'?'en':'hi')};

var TABS=[['dash','tabDash'],['prod','tabItems'],['ord','tabOrders'],['cats','tabCats'],['set','tabShop'],['cloud','tabCloud']];
function renderTabs(){$('#tabs').innerHTML=TABS.map(function(x){return '<button class="'+(tab===x[0]?'on':'')+'" data-t="'+x[0]+'">'+t(x[1])+'</button>'}).join('');
  [].forEach.call($('#tabs').children,function(b){b.onclick=function(){tab=b.getAttribute('data-t');renderTabs();render()}});}
function render(){$('#hName').textContent=DATA.shop.name||'Apni Dukaan';
  $('#hSync').textContent=CFG.token?t('onlineOk'):t('tokenNeeded');
  $('#hDot').className='dot'+(CFG.token?'':' off');
  $('#btnSave').textContent=t('save');
  $('#langBtn').textContent=(LANG==='hi'?'\u0939\u093F':'EN');
  if(tab==='dash')renderDash();else if(tab==='prod')renderProd();else if(tab==='ord')renderOrders();else if(tab==='cats')renderCats();else if(tab==='set')renderSet();else renderCloud();}

function stockInfo(p){var low=DATA.shop.lowStock||5;if(p.available===false||p.stock===0||p.stock==='0')return{k:'out',t:t('outOfStock')};if(p.stock!==''&&p.stock!=null&&Number(p.stock)<=low)return{k:'low',t:t('lowStock')+' '+p.stock};return{k:'in',t:t('available')}}
function renderDash(){
  var ps=DATA.products||[];var out=0,low=0,soon=0,val=0;
  ps.forEach(function(p){var s=stockInfo(p);if(s.k==='out')out++;else if(s.k==='low')low++;var dl=daysLeft(p.expiry);if(dl!=null&&dl<=(DATA.shop.expiryDays||30))soon++;val+=(Number(p.price)||0)*(Number(p.stock)||0)});
  var expSoon=ps.filter(function(p){var dl=daysLeft(p.expiry);return dl!=null&&dl<=(DATA.shop.expiryDays||30)}).slice(0,6);
  var lowList=ps.filter(function(p){return stockInfo(p).k!=='in'}).slice(0,6);
  $('#view').innerHTML='<div class="stats">'+
   stat('good',ps.length,t('totalItems'))+stat('',money(Math.round(val)),t('stockValue'))+stat('warn',low,t('lowStock'))+stat('bad',out,t('outOfStock'))+'</div>'+
   (soon?'<div class="banner warn" style="margin-top:14px">\u23F0 '+t('expSoon').replace('{n}',soon)+'</div>':'')+
   '<div class="card" style="margin-top:14px"><h3 class="sec">'+t('expSoonTitle')+'</h3>'+(expSoon.length?expSoon.map(function(p){return '<div style="padding:8px 0;border-bottom:.5px solid var(--sep)"><b>'+esc(p.name)+'</b><div class="note">'+t('expiryDate')+': '+fmtDate(p.expiry)+'</div></div>'}).join(''):'<div class="note">'+t('noneNow')+'</div>')+'</div>'+
   '<div class="card"><h3 class="sec">'+t('lowTitle')+'</h3>'+(lowList.length?lowList.map(function(p){return '<div style="padding:8px 0;border-bottom:.5px solid var(--sep)"><b>'+esc(p.name)+'</b><div class="note">'+stockInfo(p).t+'</div></div>'}).join(''):'<div class="note">'+t('allGood')+'</div>')+'</div>'+
   '<button class="btn full" onclick="openForm()">+ '+t('addNew')+'</button>';
}
function stat(cls,n,l){return '<div class="stat '+cls+'"><div class="n">'+n+'</div><div class="l">'+l+'</div></div>'}

var pQuery='';
function renderProd(){
  var ps=(DATA.products||[]).slice();
  if(pQuery){var q=pQuery.toLowerCase();ps=ps.filter(function(p){return ((p.name||'')+' '+(p.brand||'')+' '+(p.barcode||'')+' '+(p.category||'')).toLowerCase().indexOf(q)>-1})}
  ps.sort(function(a,b){return (a.name||'').localeCompare(b.name||'')});
  var list=ps.length?ps.map(itemHTML).join(''):'<div class="note" style="padding:22px;text-align:center">'+t('noItems')+'</div>';
  $('#view').innerHTML='<div class="toolrow"><input id="pq" placeholder="'+esc(t('searchItems'))+'" value="'+esc(pQuery)+'"/><button class="btn" style="border-radius:999px;padding:13px 18px" onclick="openForm()">+</button></div>'+
    '<div class="note" style="margin:0 4px 12px">'+t('itemsCount').replace('{n}',ps.length)+'</div><div class="list">'+list+'</div>';
  var pq=$('#pq');pq.oninput=function(){pQuery=pq.value;var pos=pq.selectionStart;renderProd();var n=$('#pq');n.focus();try{n.setSelectionRange(pos,pos)}catch(e){}};
}
function itemHTML(p){
  var s=stockInfo(p);var dl=daysLeft(p.expiry);
  var exp=dl!=null?(dl<0?'<span class="pill out">'+t('expSoonTitle')+'</span>':(dl<=(DATA.shop.expiryDays||30)?'<span class="pill low">'+dl+'d</span>':'')):'';
  var img=p.photo?'<img src="'+esc(p.photo)+'"/>':'<div class="ph">\uD83D\uDED2</div>';
  return '<div class="it" data-id="'+esc(p.id)+'">'+img+
   '<div class="info"><div class="nm">'+esc(p.name)+'</div><div class="sub"><span class="pr">'+money(p.price)+'</span>'+esc(p.unit||'')+'<span class="pill '+s.k+'">'+s.t+'</span>'+exp+'</div></div>'+
   '<button class="ico" data-act="edit">\u270E</button></div>';
}
document.addEventListener('click',function(e){
  var b=e.target.closest?e.target.closest('[data-act]'):null;if(!b)return;
  var it=b.closest('.it');if(!it)return;var id=it.getAttribute('data-id');
  var p=(DATA.products||[]).filter(function(x){return x.id===id})[0];if(!p)return;
  if(b.getAttribute('data-act')==='edit')openForm(id);

  $('#f_file').onchange=onPhoto;

function closeForm(){$('#formWrap').classList.add('hidden');editId=null}
function onPhoto(e){var f=e.target.files[0];if(!f)return;compress(f,600,0.6,function(url){$('#f_photo').value=url;$('#f_prev').innerHTML='<img src="'+url+'" style="width:100%;height:100%;object-fit:cover;border-radius:16px"/>'})}
function compress(file,maxDim,q,cb){var r=new FileReader();r.onload=function(){var img=new Image();img.onload=function(){var w=img.width,h=img.height;var s=Math.min(1,maxDim/Math.max(w,h));w=Math.round(w*s);h=Math.round(h*s);var c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);cb(c.toDataURL('image/jpeg',q))};img.src=r.result};r.readAsDataURL(file)}
function val(id){var e=$(id);return e?e.value.trim():''}
function saveForm(){
  var name=val('#f_name');if(!name){alert(t('name'));return}
  var p=editId?(DATA.products||[]).filter(function(x){return x.id===editId})[0]:{id:uid(),createdAt:new Date().toISOString()};
  p.name=name;p.category=val('#f_category');p.brand=val('#f_brand');p.photo=val('#f_photo');
  p.price=val('#f_price');p.mrp=val('#f_mrp');p.unit=val('#f_unit');p.stock=val('#f_stock');p.expiry=val('#f_expiry');p.gst=val('#f_gst');
  p.barcode=val('#f_barcode');p.hsn=val('#f_hsn');p.batch=val('#f_batch');p.cost=val('#f_cost');p.supplier=val('#f_supplier');
  p.tags=val('#f_tags');p.desc=val('#f_desc');p.available=$('#f_available').checked;p.featured=$('#f_featured').checked;p.updatedAt=new Date().toISOString();
  if(!editId)DATA.products.push(p);
  saveData();closeForm();render();
}
function delProduct(){if(!confirm(t('del')+'?'))return;DATA.products=(DATA.products||[]).filter(function(x){return x.id!==editId});saveData();closeForm();render()}

function renderCats(){
  $('#view').innerHTML='<h3 class="sec">'+t('manageCats')+'</h3><div class="card"><div class="chips">'+(DATA.shop.categories||[]).map(function(c,i){return '<span class="c">'+esc(c)+' <b data-del="'+i+'">\u2715</b></span>'}).join('')+'</div>'+
   '<div class="row2"><input id="newCat" placeholder="'+esc(t('newCatPh'))+'"/><button class="btn" onclick="addCat()">'+t('add')+'</button></div></div>'+
   '<div class="note" style="margin:0 4px">'+t('catNote')+'</div>';

function addCat(){var v=$('#newCat').value.trim();if(!v)return;DATA.shop.categories=DATA.shop.categories||[];if(DATA.shop.categories.indexOf(v)<0)DATA.shop.categories.push(v);saveData();renderCats()}

function exportJSON(){dl('grocery-backup.json',JSON.stringify(DATA,null,2))}
function exportCSV(){var ps=DATA.products||[];var cols=['name','brand','category','unit','price','mrp','cost','gst','stock','expiry','barcode','hsn','batch','supplier','tags','desc','available','featured'];var rows=[cols.join(',')];ps.forEach(function(p){rows.push(cols.map(function(c){var v=p[c]==null?'':String(p[c]);return '"'+v.replace(/"/g,'""')+'"'}).join(','))});dl('grocery-items.csv',rows.join('\n'))}
function dl(name,text){var b=new Blob([text],{type:'application/octet-stream'});var a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;a.click()}

function renderOrders(){
  var a=loadAdminOrders();
  var list=a.slice().reverse().map(function(o){
    var items=(o.items||[]).map(function(it){return esc(it.name)+(it.qty>1?' x'+it.qty:'')}).join(', ');
    return '<div class="card" style="margin-bottom:10px"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><b>'+esc(o.id)+'</b><span class="note">'+(o.at?esc(new Date(o.at).toLocaleString(LANG==='hi'?'hi-IN':'en-IN',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})):'')+'</span></div>'+
     '<div style="margin-top:8px">'+esc(o.name||'')+(o.phone?' \u00B7 '+esc(o.phone):'')+'</div>'+(o.address?'<div class="note">'+esc(o.address)+'</div>':'')+
     '<div class="note" style="margin-top:5px">'+items+'</div>'+
     '<div style="display:flex;justify-content:space-between;align-items:center;margin-top:10px"><b>'+money(o.total)+'</b><select style="width:auto" onchange="setOrderStatus(\''+esc(o.id)+'\',this.value)">'+orderStatuses().map(function(s){return '<option'+(o.status===s?' selected':'')+'>'+s+'</option>'}).join('')+'</select></div>'+
     '<div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn gray sm" onclick="delOrder(\''+esc(o.id)+'\')">'+t('del')+'</button>'+(o.phone?'<a class="btn gray sm" style="text-decoration:none" href="tel:'+esc(o.phone)+'">'+t('phone')+'</a><a class="btn gray sm" style="text-decoration:none" href="https://wa.me/91'+esc(String(o.phone).replace(/[^0-9]/g,'').slice(-10))+'">WhatsApp</a>':'')+'</div></div>';
  }).join('');
  $('#view').innerHTML='<div class="banner ok">'+t('totalOrders')+': '+a.length+'</div>'+
   '<div style="display:flex;gap:9px;flex-wrap:wrap;margin-bottom:12px"><button class="btn" onclick="addOrder()">+ '+t('addOrder')+'</button><button class="btn gray" onclick="pullOrders()">'+t('loadOnline')+'</button></div>'+
   '<div class="note" style="margin:0 4px 12px">'+t('ordersNote')+'</div>'+(list||'<div class="note" style="text-align:center;padding:22px">'+t('noOrders')+'</div>');
}
function setOrderStatus(id,st){var a=loadAdminOrders();a.forEach(function(o){if(o.id===id)o.status=st});saveAdminOrders(a)}
function delOrder(id){if(!confirm(t('confirmDel')))return;saveAdminOrders(loadAdminOrders().filter(function(o){return o.id!==id}));renderOrders()}
function addOrder(){
  var name=prompt(t('cName'));if(!name)return;
  var phone=prompt(t('cPhone'))||'';var addr=prompt(t('cAddr'))||'';var items=prompt(t('cItems'))||'';var total=Number(prompt(t('cTotal'))||0)||0;
  var o={id:'ORD-'+Date.now().toString(36).toUpperCase().slice(-6),at:new Date().toISOString(),name:name,phone:phone,address:addr,items:[{name:items,qty:1}],total:total,status:t('stNew')};
  var a=loadAdminOrders();a.push(o);saveAdminOrders(a);renderOrders();
}
async function pullOrders(){
  var url=DATA.shop.ordersUrl;if(!url){alert(t('ordersUrl'));return}
  try{var r=await fetch(url+(url.indexOf('?')>-1?'&':'?')+'t='+Date.now(),{cache:'no-store'});var j=await r.json();
    var arr=Array.isArray(j)?j:(j.orders||[]);var a=loadAdminOrders();var have={};a.forEach(function(o){have[o.id]=1});
    arr.forEach(function(o){if(o&&o.id&&!have[o.id])a.push(o)});saveAdminOrders(a);renderOrders();
  }catch(e){alert(e.message)}
}

function setSync(m){syncMsg=m;var e=$('#syncMsg');if(e)e.textContent=m}
function renderCloud(){
  var ready=!!CFG.token;
  $('#view').innerHTML=
   '<div class="banner '+(ready?'ok':'warn')+'">'+(ready?t('cloudConnected')+(CFG.lastSync?' \u00B7 '+fmtSync():''):t('connectOnce'))+'</div>'+
   '<div class="card"><h3 class="sec">'+t('cloudSettings')+'</h3>'+
   '<div class="note" style="margin-bottom:12px">'+esc(CFG.owner)+' / '+esc(CFG.repo)+' / '+esc(CFG.path)+'</div>'+
   '<a class="btn full" style="display:block;text-align:center;text-decoration:none;margin-bottom:12px" href="https://github.com/settings/tokens/new?scopes=public_repo&description=Apni%20Dukaan" target="_blank" rel="noopener">'+t('createToken')+'</a>'+
   '<div class="field"><label class="f">'+t('tokenLabel')+'</label><input id="c_token" type="password" placeholder="ghp_..." value="'+esc(CFG.token)+'"/></div>'+
   '<label class="switch"><input type="checkbox" id="c_auto"'+(CFG.autoPush?' checked':'')+'/> '+t('autoSync')+'</label>'+
   '<div style="display:flex;gap:9px;flex-wrap:wrap;margin-top:12px"><button class="btn" onclick="saveCloud()">'+t('saveToken')+'</button><button class="btn gray" onclick="cloudPush(false)">'+t('push')+'</button><button class="btn gray" onclick="cloudPull()">'+t('pull')+'</button></div>'+
   '<div class="syncbar" id="syncMsg" style="margin-top:12px">'+esc(syncMsg||'')+'</div></div>'+
   '<div class="card"><h3 class="sec">'+t('publicLink')+'</h3><div class="note" style="word-break:break-all;margin-bottom:10px">'+PUBLIC_URL+'</div><div style="display:flex;gap:9px;flex-wrap:wrap"><button class="btn gray sm" onclick="copy(\''+PUBLIC_URL+'\')">'+t('copyLink')+'</button><a class="btn gray sm" style="text-decoration:none" href="'+PUBLIC_URL+'" target="_blank">'+t('open')+'</a></div></div>'+
   '<div class="card"><h3 class="sec">'+t('howToken')+'</h3><div class="note">'+t('steps')+'<br><br>'+t('tokenSafe')+'</div></div>';
  $('#c_auto').onchange=function(){CFG.autoPush=this.checked;saveCfg()};
}
function saveCloud(){CFG.token=val('#c_token');CFG.autoPush=$('#c_auto').checked;saveCfg();setSync(CFG.token?t('tokenSaved'):t('tokenEmpty'));renderCloud()}
function copy(x){try{navigator.clipboard.writeText(x);alert(t('copied'))}catch(e){prompt(t('copyNow'),x)}}
async function cloudPush(silent){
  if(!CFG.token){if(!silent)alert(t('needToken'));return}
  if(pushing){pushQueued=true;return}
  pushing=true;setSync(t('pushing'));
  try{await doPush();CFG.lastSync=new Date().toISOString();saveCfg();setSync('\u2705 '+t('onlineSaved')+' \u00B7 '+fmtSync())}
  catch(e){setSync('\u274C '+e.message);if(!silent)alert(t('push')+' \u274C '+e.message)}
  finally{pushing=false;if(pushQueued){pushQueued=false;cloudPush(true)}}
}
async function doPush(){
  var base=API+'/repos/'+CFG.owner+'/'+CFG.repo;
  var H={'Authorization':'Bearer '+CFG.token,'Accept':'application/vnd.github+json','Content-Type':'application/json'};
  var json=JSON.stringify(DATA);var lastErr=null;
  for(var attempt=0;attempt<5;attempt++){
    try{
      var br=await fetch(base+'/git/blobs',{method:'POST',headers:H,body:JSON.stringify({content:b64(json),encoding:'base64'})});
      if(!br.ok)throw new Error('blob '+br.status);var blob=await br.json();
      var rr=await fetch(base+'/git/ref/heads/'+CFG.branch,{headers:H});if(!rr.ok)throw new Error('ref '+rr.status);var ref=await rr.json();var parent=ref.object.sha;
      var cr=await fetch(base+'/git/commits/'+parent,{headers:H});if(!cr.ok)throw new Error('head '+cr.status);var co=await cr.json();
      var tr=await fetch(base+'/git/trees',{method:'POST',headers:H,body:JSON.stringify({base_tree:co.tree.sha,tree:[{path:CFG.path,mode:'100644',type:'blob',sha:blob.sha}]})});
      if(!tr.ok)throw new Error('tree '+tr.status);var tree=await tr.json();
      var ncr=await fetch(base+'/git/commits',{method:'POST',headers:H,body:JSON.stringify({message:'Update inventory '+new Date().toISOString(),tree:tree.sha,parents:[parent]})});
      if(!ncr.ok)throw new Error('commit '+ncr.status);var nc=await ncr.json();
      var ur=await fetch(base+'/git/refs/heads/'+CFG.branch,{method:'PATCH',headers:H,body:JSON.stringify({sha:nc.sha,force:false})});
      if(!ur.ok)throw new Error('update '+ur.status);
      return;
    }catch(e){lastErr=e;await new Promise(function(res){setTimeout(res,600+attempt*600)})}
  }
  throw lastErr||new Error('push failed');
}
async function cloudPull(){
  if(!CFG.token){alert(t('needToken'));return}
  setSync(t('pullLoading'));
  try{var url='https://raw.githubusercontent.com/'+CFG.owner+'/'+CFG.repo+'/'+CFG.branch+'/'+CFG.path+'?t='+Date.now();
    var r=await fetch(url,{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);
    DATA=await r.json();try{localStorage.setItem(DATA_KEY,JSON.stringify(DATA))}catch(e){};render();setSync('\u2705 '+t('loadedOnline')+' \u00B7 '+timeNow());
  }catch(e){setSync('\u274C '+e.message)}
}
function schedulePush(){if(!CFG.autoPush||!CFG.token)return;clearTimeout(pushTimer);pushTimer=setTimeout(function(){cloudPush(true)},1800)}
